      <path d="M200 206C188 206 179 201 175 194 162 201 149 197 146 186 133 189 123 180 127 168 116 159 119 146 130 140 119 129 122 116 134 110 130 98 141 89 155 92 163 81 179 81 188 91 198 81 212 82 221 92 234 82 249 85 253 98 268 94 279 104 274 118 288 125 287 139 276 146 285 159 280 173 268 178 269 189 258 198 245 194 237 203 224 207 214 202 209 205 204 206 200 206Z" fill="#ff9e9f" stroke="#d96f79" stroke-width="7" stroke-linejoin="round"/><path d="M155 107q10 3 13 12m22-22q-5 7-1 14m29-14q-7 7-1 14m29-6q-8 6-5 13m-114 9q8 3 10 10m108 2q-8 3-9 10m-91 22q8-3 7-10m64 10q-8-3-5-10" fill="none" stroke="#ed8e87" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      
      <ellipse cx="181" cy="139" rx="4" ry="7" fill="#513b43"/><ellipse cx="220" cy="139" rx="4" ry="7" fill="#513b43"/><ellipse cx="163" cy="151" rx="9" ry="5" fill="#f27f88"/><ellipse cx="238" cy="151" rx="9" ry="5" fill="#f27f88"/><path d="M190 156q11 14 22 0" fill="none" stroke="#a8515c" stroke-width="4" stroke-linecap="round"/>
      <path d="M139 119q61-40 122 0l-4 12q-56-29-114 0z" fill="#83b9aa" stroke="#5d9589" stroke-width="3"/>
    </g>
    <g class="upperL" fill="none" stroke="#ed9b91" stroke-width="15" stroke-linecap="round"><path d="M145 157h-42"/><g class="foreL" stroke-width="13"><path d="M103 157v-43"/><path d="M96 127h14" stroke="#83b9aa" stroke-width="7"/><circle cx="103" cy="111" r="7" fill="#ffc4b7" stroke-width="3"/><path d="M84 99h38" stroke="#b97655" stroke-width="5"/><path d="M89 90v18m28-18v18" stroke="#f1bc78" stroke-width="8"/><path d="M85 99q19-5 37 0" stroke="#fff0d4" stroke-width="2"/></g></g>
    <g class="upperR" fill="none" stroke="#ed9b91" stroke-width="15" stroke-linecap="round"><path d="M255 157h42"/><g class="foreR" stroke-width="13"><path d="M297 157v-43"/><path d="M290 127h14" stroke="#83b9aa" stroke-width="7"/><circle cx="297" cy="111" r="7" fill="#ffc4b7" stroke-width="3"/><path d="M278 99h38" stroke="#b97655" stroke-width="5"/><path d="M283 90v18m28-18v18" stroke="#f1bc78" stroke-width="8"/><path d="M278 99q19-5 37 0" stroke="#fff0d4" stroke-width="2"/></g></g>
  </g>
