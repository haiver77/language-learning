<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="title desc">
  <title id="title">Corazoncito levantando una barra corta</title>
  <desc id="desc">Un corazón bebé hace un curl de bíceps con una barra pequeña de discos redondos.</desc>
  <style>
    .lift{animation:barcurl 1.5s cubic-bezier(.4,0,.2,1) infinite}
    .heart{transform-box:fill-box;transform-origin:center;animation:brace 1.5s ease-in-out infinite}
    @keyframes barcurl{0%,100%{transform:translateY(0)}48%,60%{transform:translateY(-37px)}}
    @keyframes brace{48%,60%{transform:scale(1.025) translateY(-2px)}}
    @media(prefers-reduced-motion:reduce){.lift,.heart{animation:none}}
  </style>
  <rect width="400" height="320" rx="28" fill="#fff9f1"/>
  <ellipse cx="200" cy="280" rx="96" ry="12" fill="#f3ddd2"/>
  <path d="M176 232l-14 34m62-34 14 34" stroke="#dc7d7a" stroke-width="14" stroke-linecap="round"/>
  <path d="M148 266h27m52 0h27" stroke="#c97871" stroke-width="5" stroke-linecap="round"/>
  <g class="heart">
    <path d="M200 238c-24-20-83-60-83-101 0-27 21-47 47-47 16 0 29 8 37 22 9-17 25-25 43-22 28 4 43 29 37 54-8 34-52 70-81 94z" fill="#ff9e9f" stroke="#d96f79" stroke-width="6" stroke-linejoin="round"/>
    <path d="M151 191q49 18 98-3l-12 22q-37 18-75-1z" fill="#ffe4c8"/>
    <ellipse cx="181" cy="139" rx="4" ry="7" fill="#513b43"/><ellipse cx="220" cy="139" rx="4" ry="7" fill="#513b43"/>
    <ellipse cx="163" cy="151" rx="9" ry="5" fill="#f27f88"/><ellipse cx="238" cy="151" rx="9" ry="5" fill="#f27f88"/>
    <path d="M190 156q11 14 22 0" fill="none" stroke="#a8515c" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g class="lift">
    <path d="M145 157q-24 20-20 40m130-40q24 20 20 40" fill="none" stroke="#ed9b91" stroke-width="14" stroke-linecap="round"/>
    <path d="M124 197q7 15 18 15m134-15q-7 15-18 15" fill="none" stroke="#ffc4b7" stroke-width="12" stroke-linecap="round"/>
    <path d="M87 211h226" stroke="#b87658" stroke-width="9" stroke-linecap="round"/>
    <path d="M91 195v32m13-37v42m192-37v32m13-37v42" stroke="#f1bb75" stroke-width="9" stroke-linecap="round"/>
    <path d="M77 211h7m235 0h7" stroke="#d48764" stroke-width="5" stroke-linecap="round"/>
  </g>
  <path d="M73 109l8-8m238 8-8-8" stroke="#f1bc77" stroke-width="4" stroke-linecap="round"/>
</svg>
