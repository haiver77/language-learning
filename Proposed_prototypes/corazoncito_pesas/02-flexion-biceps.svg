<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="title desc">
  <title id="title">Pequeño campeón de bíceps</title>
  <desc id="desc">El corazón bebé hace curls con pesas redondas; unos bracitos marcados destacan la flexión del bíceps.</desc>
  <style>
    .left{transform-box:view-box;transform-origin:145px 157px;animation:curlL 1.25s cubic-bezier(.4,0,.2,1) infinite}
    .right{transform-box:view-box;transform-origin:255px 157px;animation:curlR 1.25s cubic-bezier(.4,0,.2,1) infinite}
    .muscle{transform-box:fill-box;transform-origin:center;animation:pump .625s ease-in-out infinite alternate}
    @keyframes curlL{0%,100%{transform:rotate(3deg)}55%{transform:rotate(-57deg)}}
    @keyframes curlR{0%,100%{transform:rotate(-3deg)}55%{transform:rotate(57deg)}}
    @keyframes pump{to{transform:scale(1.16)}}
    @media(prefers-reduced-motion:reduce){.left,.right,.muscle{animation:none}}
  </style>
  <rect width="400" height="320" rx="28" fill="#fff9f1"/>
  <path d="M0 279q100-18 200 0t200 0" fill="none" stroke="#f0d7ca" stroke-width="4"/>
  <ellipse cx="200" cy="278" rx="89" ry="10" fill="#f3ddd2"/>
  <path d="M178 233l-14 34m58-34 14 34" stroke="#dc7d7a" stroke-width="14" stroke-linecap="round"/>
  <path d="M148 268h27m51 0h27" stroke="#c97871" stroke-width="5" stroke-linecap="round"/>
  <path d="M200 238c-24-20-83-60-83-101 0-27 21-47 47-47 16 0 29 8 37 22 9-17 25-25 43-22 28 4 43 29 37 54-8 34-52 70-81 94z" fill="#ff9e9f" stroke="#d96f79" stroke-width="6" stroke-linejoin="round"/>
  <path d="M151 191q49 18 98-3l-12 22q-37 18-75-1z" fill="#ffe4c8"/>
  <ellipse cx="181" cy="139" rx="4" ry="7" fill="#513b43"/><ellipse cx="220" cy="139" rx="4" ry="7" fill="#513b43"/>
  <ellipse cx="163" cy="151" rx="9" ry="5" fill="#f27f88"/><ellipse cx="238" cy="151" rx="9" ry="5" fill="#f27f88"/>
  <path d="M190 156q11 14 22 0" fill="none" stroke="#a8515c" stroke-width="4" stroke-linecap="round"/>
  <g class="left" fill="none" stroke="#ed9b91" stroke-width="14" stroke-linecap="round">
    <path d="M145 157q-20 14-29 34l-12 25"/><ellipse class="muscle" cx="126" cy="181" rx="11" ry="15" fill="#ffc1a8" stroke="#d97e75" stroke-width="3"/><circle cx="104" cy="216" r="7" fill="#ffc4b7" stroke-width="3"/>
    <g fill="#f2bc78" stroke="#b97655" stroke-width="4"><circle cx="91" cy="215" r="10"/><circle cx="119" cy="215" r="10"/><path d="M91 215h28" stroke-width="5"/></g>
  </g>
  <g class="right" fill="none" stroke="#ed9b91" stroke-width="14" stroke-linecap="round">
    <path d="M255 157q20 14 29 34l12 25"/><ellipse class="muscle" cx="274" cy="181" rx="11" ry="15" fill="#ffc1a8" stroke="#d97e75" stroke-width="3"/><circle cx="296" cy="216" r="7" fill="#ffc4b7" stroke-width="3"/>
    <g fill="#f2bc78" stroke="#b97655" stroke-width="4"><circle cx="281" cy="215" r="10"/><circle cx="309" cy="215" r="10"/><path d="M281 215h28" stroke-width="5"/></g>
  </g>
  <path d="M83 117q8-12 16 0m202 0q8-12 16 0" fill="none" stroke="#efbd72" stroke-width="4" stroke-linecap="round"/>
</svg>
