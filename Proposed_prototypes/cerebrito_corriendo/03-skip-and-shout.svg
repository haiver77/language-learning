<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="title desc">
  <title id="title">Skip-and-shout baby brain</title>
  <desc id="desc">A delighted baby brain bounds forward with one knee lifted and both arms joyfully raised.</desc>
  <style>
    .body{transform-box:fill-box;transform-origin:center;animation:bound .56s cubic-bezier(.4,0,.6,1) infinite}
    .arm1,.leg1{transform-box:fill-box;transform-origin:top center;animation:lift .56s ease-in-out infinite alternate}
    .arm2,.leg2{transform-box:fill-box;transform-origin:top center;animation:lift .56s ease-in-out infinite alternate-reverse}
    .spark{transform-box:fill-box;transform-origin:center;animation:twinkle .7s ease-in-out infinite alternate}
    @keyframes bound{0%,100%{transform:translateY(4px) rotate(-3deg)}50%{transform:translateY(-17px) rotate(3deg)}}
    @keyframes lift{to{transform:rotate(-38deg)}} @keyframes twinkle{to{opacity:.35;transform:scale(.75)}}
    @media(prefers-reduced-motion:reduce){.body,.arm1,.arm2,.leg1,.leg2,.spark{animation:none}}
  </style>
  <ellipse cx="201" cy="286" rx="90" ry="12" fill="#d8a4a0" opacity=".4"/>
  <g class="leg2" fill="none" stroke="#df7d74" stroke-width="16" stroke-linecap="round"><path d="M175 223q-8 28-30 30"/><path d="M145 249q-11 2-11 11 1 8 16 7l20-4q7-2 4-8l-14-11z" fill="#ffd18a" stroke-width="5"/></g>
  <g class="leg1" fill="none" stroke="#ec8a7f" stroke-width="17" stroke-linecap="round"><path d="M225 219q27 10 34-14"/><path d="M253 204q4-14 14-11 9 3 6 14l-6 15q-4 8-12 3l-9-9z" fill="#ffd18a" stroke-width="5"/></g>
  <g class="arm2" fill="none" stroke="#ee9b91" stroke-width="15" stroke-linecap="round"><path d="M139 156q-22-14-21-35"/><path d="M118 121q-8-10 0-16 8-5 14 5l4 14z" fill="#ffc5b6" stroke-width="5"/></g>
  <g class="arm1" fill="none" stroke="#ee9b91" stroke-width="15" stroke-linecap="round"><path d="M262 156q25-14 29-36"/><path d="M290 120q5-13 14-9 8 5 2 15l-9 11z" fill="#ffc5b6" stroke-width="5"/></g>
  <g class="body">
    <path d="M119 126c-8-22 8-39 29-40 5-28 37-41 59-24 19-25 55-17 63 10 27-1 43 23 30 45 18 14 14 42-7 50 7 28-13 48-40 43-14 24-46 25-62 6-24 17-54 4-56-22-25-3-37-29-24-49-13-5-17-12-12-19z" fill="#ffb5ad" stroke="#d97871" stroke-width="6" stroke-linejoin="round"/>
    <path d="M155 103q-7 14 6 22m22-40q-4 14 8 20m28-30q-9 12 0 24m29-12q-12 10-5 22m30 7q-14 4-15 17m15 26q-14-6-23 4m-24 21q-4-14-17-13m-37 12q7-12 0-22" fill="none" stroke="#f08e87" stroke-width="5" stroke-linecap="round"/>
    <path d="M180 144q8-7 16 0m31 0q8-7 16 0" fill="none" stroke="#9e5961" stroke-width="4" stroke-linecap="round"/>
    <path d="M194 157q15 25 34 0q-3 22-18 22t-16-22z" fill="#9e4e58"/>
    <ellipse cx="166" cy="161" rx="10" ry="6" fill="#f28e91"/><ellipse cx="259" cy="161" rx="10" ry="6" fill="#f28e91"/>
  </g>
  <g class="spark" fill="none" stroke="#f1b35f" stroke-width="5" stroke-linecap="round"><path d="M81 107v20m-10-10h20"/><path d="M321 185v18m-9-9h18"/><path d="M202 45v13m-7-7h14"/></g>
</svg>
