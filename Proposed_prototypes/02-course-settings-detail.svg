<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">02 — Course Settings: focused progression</title>
  <desc id="desc">A focused Course Settings screen with four editable repetition thresholds arranged along a vertical progression line.</desc>
  <rect width="390" height="844" fill="#f3f7f1"/>
  <g font-family="Arial,sans-serif">
