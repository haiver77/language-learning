<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="title desc">
  <title id="title">Little-sneaker sprint</title>
  <desc id="desc">A smiling baby brain pumps its arms and jogs in oversized sunny-yellow running shoes.</desc>
  <style>
    .torso{transform-box:fill-box;transform-origin:center;animation:bounce .5s ease-in-out infinite alternate}
    .shoe-a,.shoe-b{transform-box:fill-box;transform-origin:top center;animation:run .5s ease-in-out infinite alternate}
    .shoe-b{animation-direction:alternate-reverse}
    .laces{animation:lace .5s ease-in-out infinite alternate}
    @keyframes bounce{to{transform:translateY(-8px)}} @keyframes run{to{transform:rotate(35deg)}}
    @keyframes lace{to{transform:translateY(-3px)}}
    @media(prefers-reduced-motion:reduce){.torso,.shoe-a,.shoe-b,.laces{animation:none}}
  </style>
  <ellipse cx="203" cy="283" rx="103" ry="12" fill="#d8a4a0" opacity=".38"/>
  <g class="shoe-b" fill="none" stroke="#df7e75" stroke-width="18" stroke-linecap="round"><path d="M174 223q-1 30-26 38"/><path d="M149 259q-15-4-19 7-3 10 12 14l29 2q12 0 12-8l-10-18z" fill="#ffd071" stroke-width="5"/><path class="laces" d="M142 267l17 4m-20 3 18 4" stroke="#fff5df" stroke-width="3"/></g>
  <g class="shoe-a" fill="none" stroke="#e9867b" stroke-width="18" stroke-linecap="round"><path d="M229 220q12 30 37 25"/><path d="M263 237q12-12 21-3 9 8 0 18l-21 20q-9 8-15-1l-9-18z" fill="#ffd071" stroke-width="5"/><path class="laces" d="M258 249l15-3m-12 10 15-3" stroke="#fff5df" stroke-width="3"/></g>
  <path d="M133 166q-24 10-30 30m160-36q22-4 31-20" fill="none" stroke="#ed978d" stroke-width="15" stroke-linecap="round"/>
  <circle cx="102" cy="197" r="8" fill="#ffc5b6"/><circle cx="295" cy="139" r="8" fill="#ffc5b6"/>
  <g class="torso">
    <path d="M119 126c-8-22 8-39 29-40 5-28 37-41 59-24 19-25 55-17 63 10 27-1 43 23 30 45 18 14 14 42-7 50 7 28-13 48-40 43-14 24-46 25-62 6-24 17-54 4-56-22-25-3-37-29-24-49-13-5-17-12-12-19z" fill="#ffb5ad" stroke="#d97871" stroke-width="6" stroke-linejoin="round"/>
    <path d="M155 103q-7 14 6 22m22-40q-4 14 8 20m28-30q-9 12 0 24m29-12q-12 10-5 22m30 7q-14 4-15 17m15 26q-14-6-23 4m-24 21q-4-14-17-13m-37 12q7-12 0-22" fill="none" stroke="#f08e87" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="187" cy="147" rx="6" ry="8" fill="#533b42"/><ellipse cx="239" cy="147" rx="6" ry="8" fill="#533b42"/>
    <path d="M197 163q15 18 30-1" fill="none" stroke="#a94f58" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="169" cy="162" rx="10" ry="6" fill="#f28e91"/><ellipse cx="255" cy="162" rx="10" ry="6" fill="#f28e91"/>
  </g>
  <path d="M73 221h26m204-93h25m-260 20h15" stroke="#f2b66f" stroke-width="5" stroke-linecap="round"/>
</svg>
