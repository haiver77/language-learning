<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 154" role="img" aria-labelledby="t d">
  <title id="t">Live transcription — Cloud wall 01</title><desc id="d">A single enormous soft cloud wall rolls over the full practice card, then retreats, with a few gentle sparkles.</desc>
  <defs><linearGradient id="cloud" x1="0" x2="1"><stop stop-color="#93d2a4" stop-opacity=".16"/><stop offset=".3" stop-color="#a8dbb5" stop-opacity=".3"/><stop offset=".56" stop-color="#f0d48d" stop-opacity=".42"/><stop offset=".78" stop-color="#d5c4ed" stop-opacity=".35"/><stop offset="1" stop-color="#93d2a4" stop-opacity=".16"/></linearGradient><clipPath id="card"><rect x="13" y="13" width="734" height="128" rx="21"/></clipPath></defs>
  <style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#173c36}.muted{fill:#667d76}.cloud{transform-box:fill-box;animation:roll 15s ease-in-out infinite alternate}.spark{transform-box:fill-box;transform-origin:center;animation:twinkle 3s ease-in-out infinite}.bar{transform-box:fill-box;transform-origin:center;animation:wave 1s ease-in-out infinite alternate}@keyframes roll{0%{transform:translateX(110%)}42%,58%{transform:translateX(0)}100%{transform:translateX(-110%)}}@keyframes twinkle{50%{opacity:.18;transform:scale(.7)}}@keyframes wave{to{transform:scaleY(.5)}}@media(prefers-reduced-motion:reduce){.cloud,.spark,.bar{animation:none}}</style>
  <rect x="12" y="12" width="736" height="130" rx="22" fill="#fffdf5" stroke="#16805d" stroke-width="2"/><g clip-path="url(#card)"><path class="cloud" d="M-180-18H850C980-18 1005 18 880 28C1030 40 1010 69 875 76C1005 90 980 120 865 126C990 148 945 172 820 170H-180Z" fill="url(#cloud)"/></g>
  <path class="spark" d="M654 30l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#e5c66f" opacity=".8"/><circle class="spark" cx="700" cy="48" r="2.5" fill="#94c995" opacity=".8" style="animation-delay:.75s"/><path class="spark" d="M727 75l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#c5a7dd" opacity=".8" style="animation-delay:1.25s"/>
  <text x="30" y="36" font-size="12" font-weight="700">Live transcription and scoring</text><rect x="28" y="49" width="108" height="46" rx="14" fill="#f3faf2" stroke="#b8dac8"/><path d="M48 82V66" stroke="#398b63" stroke-width="2" stroke-linecap="round"/><path d="M48 72c-9-1-9-9 0-8 3 2 3 6 0 8z" fill="#79c293"/><path d="M48 76c9-1 9-9 0-8" fill="#a3d8ad"/><text x="62" y="68" font-size="11" class="muted" font-weight="700">Streak</text><text x="62" y="86" font-size="16" font-weight="800">0</text>
  <text x="151" y="63" font-size="11" font-weight="700">Phrase progress</text><text x="720" y="63" font-size="11" text-anchor="end" font-weight="700">0%</text><rect x="151" y="73" width="413" height="9" rx="5" fill="#e5eee7"/><rect x="151" y="73" width="4" height="9" rx="5" fill="#62b98d"/>
  <g fill="#68b98a"><rect class="bar" x="583" y="72" width="4" height="11" rx="2"/><rect class="bar" x="592" y="68" width="4" height="19" rx="2" style="animation-delay:.12s"/><rect class="bar" x="601" y="63" width="4" height="29" rx="2" style="animation-delay:.24s"/><rect class="bar" x="610" y="70" width="4" height="15" rx="2" style="animation-delay:.36s"/><rect class="bar" x="619" y="65" width="4" height="25" rx="2" style="animation-delay:.48s"/><rect class="bar" x="628" y="72" width="4" height="11" rx="2" style="animation-delay:.6s"/></g>
  <text x="30" y="121" font-size="13" font-weight="700">Listening...</text><circle cx="692" cy="116" r="3" fill="#53aa7d"/><text x="720" y="121" font-size="13" text-anchor="end" font-weight="700">0s</text>
</svg>
