<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 154" role="img" aria-labelledby="t d">
  <title id="t">Live transcription — Cloud wall 07</title><desc id="d">A gently scalloped cloud front grows across the full card, blankets it briefly, then rolls back.</desc>
  <defs><linearGradient id="cloud" x1="0" x2="1"><stop stop-color="#93d2a4" stop-opacity=".12"/><stop offset=".32" stop-color="#a8dbb5" stop-opacity=".31"/><stop offset=".58" stop-color="#f0d48d" stop-opacity=".44"/><stop offset=".8" stop-color="#d5c4ed" stop-opacity=".35"/><stop offset="1" stop-color="#93d2a4" stop-opacity=".12"/></linearGradient><clipPath id="card"><rect x="13" y="13" width="734" height="128" rx="21"/></clipPath></defs>
  <style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#173c36}.muted{fill:#667d76}.cloud{transform-box:fill-box;animation:roll 16s ease-in-out infinite alternate}.spark{transform-box:fill-box;transform-origin:center;animation:twinkle 3s ease-in-out infinite}.bar{transform-box:fill-box;transform-origin:center;animation:wave 1s ease-in-out infinite alternate}@keyframes roll{0%{transform:translateX(110%)}42%,58%{transform:translateX(0)}100%{transform:translateX(-110%)}}@keyframes twinkle{50%{opacity:.18;transform:scale(.7)}}@keyframes wave{to{transform:scaleY(.5)}}@media(prefers-reduced-motion:reduce){.cloud,.spark,.bar{animation:none}}</style>
  <rect x="12" y="12" width="736" height="130" rx="22" fill="#fffdf5" stroke="#16805d" stroke-width="2"/><g clip-path="url(#card)"><path class="cloud" d="M-200-20H790C890-20 950 3 875 21C990 24 1010 48 870 59C1000 72 990 96 860 103C995 116 960 143 820 145C915 165 870 175 780 172H-200Z" fill="url(#cloud)"/></g>
  <path class="spark" d="M659 32l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#e4c76e" opacity=".8"/><path class="spark" d="M713 44l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#c7a9dc" opacity=".8" style="animation-delay:.8s"/><circle class="spark" cx="676" cy="78" r="3" fill="#91ca97" opacity=".8" style="animation-delay:1.4s"/>
  <text x="30" y="36" font-size="12" font-weight="700">Live transcription and scoring</text><rect x="28" y="49" width="108" height="46" rx="14" fill="#f3faf2" stroke="#b8dac8"/><path d="M48 82V66" stroke="#398b63" stroke-width="2" stroke-linecap="round"/><path d="M48 72c-9-1-9-9 0-8 3 2 3 6 0 8z" fill="#79c293"/><path d="M48 76c9-1 9-9 0-8" fill="#a3d8ad"/><text x="62" y="68" font-size="11" class="muted" font-weight="700">Streak</text><text x="62" y="86" font-size="16" font-weight="800">0</text>
  <text x="151" y="63" font-size="11" font-weight="700">Phrase progress</text><text x="720" y="63" font-size="11" text-anchor="end" font-weight="700">0%</text><rect x="151" y="73" width="413" height="9" rx="5" fill="#e5eee7"/><rect x="151" y="73" width="4" height="9" rx="5" fill="#62b98d"/>
