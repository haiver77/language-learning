<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1080" role="img" aria-labelledby="title desc">
  <title id="title">49 — Compact practice type list with phrases-per-word badges</title>
  <desc id="desc">Variant of the compact practice type list with a phrase count badge on every practice mode card.</desc>
  <rect width="760" height="1080" fill="#eef1f6"/>
  <rect x="28" y="22" width="704" height="1036" rx="32" fill="#fff"/>
  <text x="64" y="70" font-family="Arial" font-size="23" font-weight="700" fill="#273449">‹ Back to Unit_1</text>
  <text x="64" y="133" font-family="Arial" font-size="29" font-weight="700" fill="#202b3b">Practice format</text>
  <text x="64" y="162" font-family="Arial" font-size="14" fill="#68768a">Choose which lesson rows are used for each focus word.</text>

  <rect x="64" y="207" width="632" height="111" rx="20" fill="#f4f1ff" stroke="#806dcc" stroke-width="2"/>
  <text x="90" y="246" font-family="Arial" font-size="18" font-weight="700" fill="#312a59">Práctica individual</text>
  <text x="90" y="274" font-family="Arial" font-size="14" fill="#69627f">Only the first phrase from each lesson file.</text>
  <rect x="90" y="283" width="122" height="27" rx="9" fill="#e3dfff"/>
  <text x="151" y="302" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#5947ad">1 phrase / word</text>
  <text x="550" y="302" font-family="Arial" font-size="11" font-weight="700" fill="#5c49b4">ACTIVE</text>
  <circle cx="657" cy="263" r="16" fill="#6652b8"/>
  <path d="M649 263l6 6 11-13" fill="none" stroke="#fff" stroke-width="3"/>

  <rect x="64" y="334" width="632" height="111" rx="20" fill="#fff" stroke="#e0e5ed"/>
  <text x="90" y="373" font-family="Arial" font-size="18" font-weight="700" fill="#283448">Uso simple</text>
  <text x="90" y="403" font-family="Arial" font-size="14" fill="#68768a">The first three phrases from each lesson file.</text>
  <rect x="90" y="410" width="138" height="27" rx="9" fill="#f0f2f7"/>
  <text x="159" y="429" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#596579">3 phrases / word</text>
  <circle cx="657" cy="390" r="16" fill="#f1f3f7" stroke="#c9d0da"/>

  <rect x="64" y="461" width="632" height="111" rx="20" fill="#fff" stroke="#e0e5ed"/>
  <text x="90" y="500" font-family="Arial" font-size="18" font-weight="700" fill="#283448">Uso en preguntas</text>
  <text x="90" y="530" font-family="Arial" font-size="14" fill="#68768a">The phrase in row 4 of each lesson file.</text>
  <rect x="90" y="537" width="122" height="27" rx="9" fill="#f0f2f7"/>
  <text x="151" y="556" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#596579">1 phrase / word</text>
  <circle cx="657" cy="517" r="16" fill="#f1f3f7" stroke="#c9d0da"/>

  <rect x="64" y="626" width="632" height="153" rx="22" fill="#f6f7fa"/>
  <text x="90" y="670" font-family="Arial" font-size="14" font-weight="700" fill="#39465a">Changing the format</text>
  <text x="90" y="704" font-family="Arial" font-size="14" fill="#68768a">Loads a newly combined lesson for the current unit</text>
  <text x="90" y="730" font-family="Arial" font-size="14" fill="#68768a">and restarts the session at phrase one.</text>

  <rect x="64" y="907" width="632" height="58" rx="17" fill="#6652b8"/>
  <text x="380" y="944" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">Apply and restart session</text>
</svg>
