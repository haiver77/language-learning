<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="title desc">
  <title id="title">Ribbon-trail baby brain</title>
  <desc id="desc">A happy baby brain runs with a looping pastel ribbon that traces the rhythm of its stride.</desc>
  <style>
    .brain{transform-box:fill-box;transform-origin:center;animation:hop .5s ease-in-out infinite alternate}
    .limb1,.limb2{transform-box:fill-box;transform-origin:top center;animation:leg .5s ease-in-out infinite alternate}
    .limb2{animation-direction:alternate-reverse}
    .ribbon{stroke-dasharray:20 13;animation:flow .65s linear infinite}
    @keyframes hop{to{transform:translateY(-9px) rotate(2deg)}} @keyframes leg{to{transform:rotate(33deg)}}
    @keyframes flow{to{stroke-dashoffset:-66}}
    @media(prefers-reduced-motion:reduce){.brain,.limb1,.limb2,.ribbon{animation:none}}
  </style>
  <path class="ribbon" d="M40 251c31-52 60 43 91-8s56-18 72 8 47 20 69-22 46 3 87 5" fill="none" stroke="#f4c27e" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="203" cy="283" rx="85" ry="11" fill="#d8a4a0" opacity=".35"/>
  <g class="limb2" fill="none" stroke="#e88478" stroke-width="16" stroke-linecap="round"><path d="M173 224q-6 28-26 38"/><path d="M147 261l-14 9q-8 8 1 13l26 0q12-2 7-10z" fill="#ffd18a" stroke-width="5"/></g>
  <g class="limb1" fill="none" stroke="#e88478" stroke-width="16" stroke-linecap="round"><path d="M230 220q13 28 41 22"/><path d="M267 235q12-11 21-3 8 8 0 16l-20 16q-9 6-14-2l-8-17z" fill="#ffd18a" stroke-width="5"/></g>
  <path d="M137 164q-22 12-28 28m151-29q22-4 30-20" fill="none" stroke="#ed978d" stroke-width="14" stroke-linecap="round"/>
  <g class="brain">
    <path d="M119 126c-8-22 8-39 29-40 5-28 37-41 59-24 19-25 55-17 63 10 27-1 43 23 30 45 18 14 14 42-7 50 7 28-13 48-40 43-14 24-46 25-62 6-24 17-54 4-56-22-25-3-37-29-24-49-13-5-17-12-12-19z" fill="#ffb5ad" stroke="#d97871" stroke-width="6" stroke-linejoin="round"/>
    <path d="M155 103q-7 14 6 22m22-40q-4 14 8 20m28-30q-9 12 0 24m29-12q-12 10-5 22m30 7q-14 4-15 17m15 26q-14-6-23 4m-24 21q-4-14-17-13m-37 12q7-12 0-22" fill="none" stroke="#f08e87" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="187" cy="147" rx="6" ry="8" fill="#533b42"/><ellipse cx="239" cy="147" rx="6" ry="8" fill="#533b42"/>
    <path d="M197 163q15 18 30-1" fill="none" stroke="#a94f58" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="169" cy="162" rx="10" ry="6" fill="#f28e91"/><ellipse cx="255" cy="162" rx="10" ry="6" fill="#f28e91"/>
  </g>
  <circle cx="82" cy="95" r="5" fill="#f2b66f"/><circle cx="321" cy="206" r="4" fill="#f2b66f"/>
</svg>
