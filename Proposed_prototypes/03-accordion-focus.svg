<title id="t">03 — Accordion focus</title><desc id="d">Full-screen, thumb-friendly Settings. Expandable groups retain Language 1 and Language 2 selectors, Language to practice and Practice language, Speaking Practice fields (Min. Similarity (%), Silence Wait (sec), Wait After Reach Min. Similarity (sec), Match celebration time (sec)), and Course Settings values Known, Learning, Learned, Mastered. Appearance and Theme opens a separate screen; exit with Done, never by dragging.</desc>
