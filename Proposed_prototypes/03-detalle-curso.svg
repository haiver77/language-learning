<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1080" role="img" aria-labelledby="title desc">
  <title id="title">46 — Course details with differentiated summary and unit progress</title>
  <desc id="desc">The course information sits on a tinted panel with a four-line description and side-by-side metadata; each unit card includes an illustrative progress bar before its Select and Details actions.</desc>
  <rect width="760" height="1080" fill="#eef1f6"/>
  <rect x="28" y="22" width="704" height="1036" rx="32" fill="#fbfcfe"/>

  <rect x="48" y="42" width="664" height="295" rx="26" fill="#f1eeff"/>
  <text x="66" y="75" font-family="Arial" font-size="12" font-weight="700" fill="#6652b8">ITALIAN · A1</text>
  <text x="66" y="109" font-family="Arial" font-size="18" font-weight="700" fill="#202b3b">ESIT-NounsFrequentlyUsedByRank_</text>
  <text x="66" y="133" font-family="Arial" font-size="18" font-weight="700" fill="#202b3b">Top500</text>
  <text x="66" y="174" font-family="Arial" font-size="13" fill="#596579">Curso de italiano para hablantes de español,</text>
  <text x="66" y="195" font-family="Arial" font-size="13" fill="#596579">nivel A1, centrado en sustantivos frecuentes.</text>
  <text x="66" y="216" font-family="Arial" font-size="13" fill="#596579">Se prioriza el uso de vocabulario simple</text>
  <text x="66" y="237" font-family="Arial" font-size="13" fill="#596579">y básico A1.</text>
  <rect x="478" y="73" width="214" height="91" rx="16" fill="#fff"/>
  <text x="498" y="106" font-family="Arial" font-size="11" fill="#778196">FOCUS VOCABULARY</text>
  <text x="498" y="137" font-family="Arial" font-size="21" font-weight="700" fill="#342b63">498 words</text>
  <rect x="478" y="177" width="214" height="91" rx="16" fill="#fff"/>
  <text x="498" y="210" font-family="Arial" font-size="11" fill="#778196">SUPPLEMENTARY</text>
  <text x="498" y="241" font-family="Arial" font-size="21" font-weight="700" fill="#344054">0 words</text>

