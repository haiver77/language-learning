<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="title desc">
  <title id="title">Long-stride baby brain</title>
  <desc id="desc">A baby brain leans into a fast run with a wide, clearly alternating long stride and streaming motion marks.</desc>
  <style>
    .character{transform-box:fill-box;transform-origin:center;animation:surge .43s ease-in-out infinite alternate}
    .leg-left,.arm-left{transform-box:fill-box;transform-origin:top center;animation:longrun .43s ease-in-out infinite alternate}
    .leg-right,.arm-right{transform-box:fill-box;transform-origin:top center;animation:longrun .43s ease-in-out infinite alternate-reverse}
    .speed{animation:move .5s linear infinite}
    @keyframes surge{to{transform:translate(6px,-7px) rotate(5deg)}} @keyframes longrun{to{transform:rotate(48deg)}}
    @keyframes move{to{transform:translateX(-20px);opacity:.2}}
    @media(prefers-reduced-motion:reduce){.character,.leg-left,.leg-right,.arm-left,.arm-right,.speed{animation:none}}
  </style>
  <g class="speed" stroke="#f2bd76" stroke-width="5" stroke-linecap="round"><path d="M33 118h58M48 143h44M28 169h50"/></g>
  <ellipse cx="204" cy="282" rx="100" ry="12" fill="#d8a4a0" opacity=".36"/>
  <g class="leg-left" fill="none" stroke="#d97871" stroke-width="17" stroke-linecap="round"><path d="M177 221q-4 33-39 46"/><path d="M141 265q-14 2-14 12 1 9 18 9l29-5q10-2 4-10l-18-11z" fill="#ffd18a" stroke-width="5"/></g>
  <g class="leg-right" fill="none" stroke="#e88478" stroke-width="17" stroke-linecap="round"><path d="M230 218q26 26 58 16"/><path d="M283 231q15-13 23-3 7 8-3 17l-25 17q-10 6-15-3l-8-17z" fill="#ffd18a" stroke-width="5"/></g>
  <g class="arm-left" fill="none" stroke="#e99187" stroke-width="15" stroke-linecap="round"><path d="M141 160q-21 17-40 9"/><circle cx="99" cy="168" r="8" fill="#ffc5b6" stroke-width="5"/></g>
  <g class="arm-right" fill="none" stroke="#ef9a90" stroke-width="15" stroke-linecap="round"><path d="M266 156q22-10 31-30"/><circle cx="299" cy="122" r="8" fill="#ffc5b6" stroke-width="5"/></g>
  <g class="character">
    <path d="M119 126c-8-22 8-39 29-40 5-28 37-41 59-24 19-25 55-17 63 10 27-1 43 23 30 45 18 14 14 42-7 50 7 28-13 48-40 43-14 24-46 25-62 6-24 17-54 4-56-22-25-3-37-29-24-49-13-5-17-12-12-19z" fill="#ffb5ad" stroke="#d97871" stroke-width="6" stroke-linejoin="round"/>
    <path d="M155 103q-7 14 6 22m22-40q-4 14 8 20m28-30q-9 12 0 24m29-12q-12 10-5 22m30 7q-14 4-15 17m15 26q-14-6-23 4m-24 21q-4-14-17-13m-37 12q7-12 0-22" fill="none" stroke="#f08e87" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="187" cy="147" rx="6" ry="8" fill="#533b42"/><ellipse cx="239" cy="147" rx="6" ry="8" fill="#533b42"/>
    <path d="M197 163q15 18 30-1" fill="none" stroke="#a94f58" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="169" cy="162" rx="10" ry="6" fill="#f28e91"/><ellipse cx="255" cy="162" rx="10" ry="6" fill="#f28e91"/>
  </g>
  <path d="M329 174h27m-21 16h18m-9-42h12" stroke="#f2bd76" stroke-width="5" stroke-linecap="round"/>
</svg>
