<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1080" role="img" aria-labelledby="title desc">
  <title id="title">48 — Unit details with three-line description</title>
  <desc id="desc">Variant of prototype 47 with a three-line unit description and the content below it shifted down for clear spacing.</desc>
  <rect width="760" height="1080" fill="#eff2f7"/>
  <rect x="28" y="22" width="704" height="1036" rx="32" fill="#fbfcff"/>
  <text x="64" y="70" font-family="Arial" font-size="23" font-weight="700" fill="#273449">‹  Course units</text>
  <text x="64" y="132" font-family="Arial" font-size="30" font-weight="700" fill="#202b3b">Unit_1</text>
  <text x="64" y="165" font-family="Arial" font-size="15" fill="#68768a">Vocabulario foco, elementos 1–30 del origen,</text>
  <text x="64" y="186" font-family="Arial" font-size="15" fill="#68768a">con sustantivos frecuentes para ampliar el vocabulario</text>
  <text x="64" y="207" font-family="Arial" font-size="15" fill="#68768a">y practicar su uso en frases sencillas de italiano.</text>

  <rect x="64" y="228" width="316" height="54" rx="16" fill="#6652b8"/>
