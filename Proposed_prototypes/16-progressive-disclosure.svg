<title id="t">16 — Progressive disclosure</title><desc id="d">Common language controls stay visible; Speaking Practice and Course Settings expand in place. Course number fields are Known, Learning, Learned, and Mastered. Appearance and Theme opens a dedicated screen. Settings exits explicitly and never by swipe-down.</desc>
