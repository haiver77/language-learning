<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Mobile pronunciation sounds — resonance rings</title><desc id="desc">Compact event settings with small concentric ring illustrations and preview actions.</desc>
  <defs>
    <symbol id="art" viewBox="0 0 18 18"><circle cx="9" cy="9" r="2" fill="#367c82"/><circle cx="9" cy="9" r="5" fill="none" stroke="#367c82" stroke-width="1.4"/><circle cx="9" cy="9" r="8" fill="none" stroke="#8bb4b6" stroke-width="1.2"/></symbol>
    <symbol id="tile" viewBox="0 0 180 44"><rect x=".5" y=".5" width="179" height="43" rx="11" fill="#fff" stroke="#dce4ec"/><circle cx="10" cy="22" r="5" fill="#fff" stroke="#778397" stroke-width="1.3"/><use href="#art" x="20" y="13" width="18" height="18"/><rect x="132" y="4" width="44" height="36" rx="9" fill="#f3f5f9" stroke="#dce4ec"/><path d="M139 16l6 4-6 4z" fill="#526378"/><text x="158" y="25" text-anchor="middle" fill="#334155" font-size="8" font-weight="700">Preview</text></symbol><symbol id="selected" viewBox="0 0 180 44"><rect x=".5" y=".5" width="179" height="43" rx="11" fill="#f5f1ff" stroke="#7958d6" stroke-width="1.6"/><circle cx="10" cy="22" r="5" fill="#7958d6"/><circle cx="10" cy="22" r="2" fill="#fff"/><use href="#art" x="20" y="13" width="18" height="18"/><rect x="132" y="4" width="44" height="36" rx="9" fill="#fff" stroke="#cfc2f5"/><path d="M139 16l6 4-6 4z" fill="#5b3cb2"/><text x="158" y="25" text-anchor="middle" fill="#5b3cb2" font-size="8" font-weight="700">Preview</text></symbol><symbol id="none" viewBox="0 0 180 44"><rect x=".5" y=".5" width="179" height="43" rx="11" fill="#fff" stroke="#dce4ec"/><circle cx="10" cy="22" r="5" fill="#fff" stroke="#778397" stroke-width="1.3"/><use href="#art" x="20" y="13" width="18" height="18"/><text x="143" y="25" text-anchor="middle" fill="#8793a3" font-size="8" font-weight="700">Off</text></symbol>
    <style>text{font-family:Arial,sans-serif}.ink{fill:#172335}.muted{fill:#64748b}.panel{fill:#f7f9fc;stroke:#e6ebf1}</style>
  </defs>
  <rect width="390" height="844" fill="#f2f5f9"/><text x="12" y="20" class="muted" font-size="8" font-weight="700" letter-spacing="1">SETTINGS  /  SPEAKING OPTIONS</text><text x="12" y="47" class="ink" font-size="21" font-weight="700">Pronunciation sounds</text><text x="12" y="66" class="muted" font-size="10">Choose a sound; tap Preview to listen. Saved automatically.</text>
  <g><rect class="panel" x="9" y="83" width="372" height="232" rx="16"/><circle cx="22" cy="103" r="4" fill="#45ad7a"/><text x="33" y="107" class="ink" font-size="12" font-weight="700">Word pronounced correctly</text><use href="#none" x="12" y="117"/><text x="54" y="143" class="ink" font-size="10" font-weight="700">None</text><use href="#selected" x="198" y="117"/><text x="240" y="143" class="ink" font-size="10" font-weight="700">Crystal burst</text><use href="#tile" x="12" y="166"/><text x="54" y="192" class="ink" font-size="10">Brass triumph</text><use href="#tile" x="198" y="166"/><text x="240" y="192" class="ink" font-size="10">Starlight cascade</text><use href="#tile" x="12" y="215"/><text x="54" y="241" class="ink" font-size="10">Power fanfare</text><use href="#tile" x="198" y="215"/><text x="240" y="241" class="ink" font-size="10">Victory chord</text><use href="#tile" x="12" y="264"/><text x="54" y="290" class="ink" font-size="10">Arcade burst</text></g>
  <g><rect class="panel" x="9" y="317" width="372" height="232" rx="16"/><circle cx="22" cy="337" r="4" fill="#e77a67"/><text x="33" y="341" class="ink" font-size="12" font-weight="700">Word pronounced incorrectly</text><use href="#none" x="12" y="351"/><text x="54" y="377" class="ink" font-size="10" font-weight="700">None</text><use href="#selected" x="198" y="351"/><text x="240" y="377" class="ink" font-size="10" font-weight="700">Boss alert</text><use href="#tile" x="12" y="400"/><text x="54" y="426" class="ink" font-size="10">Electric strike</text><use href="#tile" x="198" y="400"/><text x="240" y="426" class="ink" font-size="10">Deep thunder</text><use href="#tile" x="12" y="449"/><text x="54" y="475" class="ink" font-size="10">Strong buzzer</text><use href="#tile" x="198" y="449"/><text x="240" y="475" class="ink" font-size="10">Descending alert</text><use href="#tile" x="12" y="498"/><text x="54" y="524" class="ink" font-size="10">Low impact</text></g>
  <g><rect class="panel" x="9" y="551" width="372" height="232" rx="16"/><circle cx="22" cy="571" r="4" fill="#499cc6"/><text x="33" y="575" class="ink" font-size="12" font-weight="700">Moving to the next word or phrase</text><use href="#none" x="12" y="585"/><text x="54" y="611" class="ink" font-size="10" font-weight="700">None</text><use href="#selected" x="198" y="585"/><text x="240" y="611" class="ink" font-size="10" font-weight="700">Launch flare</text><use href="#tile" x="12" y="634"/><text x="54" y="660" class="ink" font-size="10">Portal chord</text><use href="#tile" x="198" y="634"/><text x="240" y="660" class="ink" font-size="10">Neon ricochet</text><use href="#tile" x="12" y="683"/><text x="54" y="709" class="ink" font-size="10">Bold fanfare</text><use href="#tile" x="198" y="683"/><text x="240" y="709" class="ink" font-size="10">Impact launch</text><use href="#tile" x="12" y="732"/><text x="54" y="758" class="ink" font-size="10">Arcade jump</text></g><text x="12" y="808" class="muted" font-size="9">One sound per event · “Off” plays no sound</text>
</svg>
