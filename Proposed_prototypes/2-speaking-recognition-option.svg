    <text x="32" y="237" fill="#869399" font-size="9">50</text><text x="358" y="237" fill="#869399" font-size="9" text-anchor="end">100</text>
    <text x="32" y="270" fill="#aeb8bc" font-size="10">Higher similarity requires a closer match.</text>
    <rect x="16" y="307" width="358" height="78" rx="17" fill="#242627"/>
    <text x="32" y="337" fill="#e9edef" font-size="12" font-weight="700">Silence Wait (sec)</text><text x="32" y="360" fill="#aab5b9" font-size="10">How long to wait for speech</text>
    <rect x="275" y="327" width="83" height="38" rx="11" fill="#34393b"/><text x="288" y="352" fill="#c1cace" font-size="16">−</text><text x="316" y="352" fill="#f3f5f6" font-size="14" font-weight="700">3</text><text x="345" y="352" fill="#c1cace" font-size="16">+</text>
    <rect x="16" y="397" width="358" height="92" rx="17" fill="#242627"/>
    <text x="32" y="426" fill="#e9edef" font-size="11" font-weight="700">Wait After Reach Min. Similarity (sec)</text><text x="32" y="450" fill="#aab5b9" font-size="10">Extra time before confirming a match</text>
    <rect x="275" y="439" width="83" height="38" rx="11" fill="#34393b"/><text x="288" y="464" fill="#c1cace" font-size="16">−</text><text x="316" y="464" fill="#f3f5f6" font-size="14" font-weight="700">3</text><text x="345" y="464" fill="#c1cace" font-size="16">+</text>
    <rect x="16" y="501" width="358" height="82" rx="17" fill="#242627"/>
    <text x="32" y="531" fill="#e9edef" font-size="11" font-weight="700">Match celebration time (sec)</text><text x="32" y="555" fill="#aab5b9" font-size="10">Duration of the success animation</text>
    <rect x="275" y="523" width="83" height="38" rx="11" fill="#34393b"/><text x="288" y="548" fill="#c1cace" font-size="16">−</text><text x="316" y="548" fill="#f3f5f6" font-size="13" font-weight="700">1.2</text><text x="345" y="548" fill="#c1cace" font-size="16">+</text>
    <text x="20" y="617" fill="#87949a" font-size="10">Changes apply to speaking practice.</text>
    <rect y="756" width="390" height="62" fill="#1b1c1d"/><path d="M0 756h390" stroke="#303234"/>
