<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Settings detail — Speaking Recognition Options</title>
  <desc id="desc">Standalone speaking recognition screen with the current similarity, silence, wait-after-match, and celebration values.</desc>
  <defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" fill="#08719a" opacity=".4"/></pattern></defs>
  <rect width="390" height="844" fill="#070808"/><rect width="390" height="112" fill="url(#dots)"/>
  <g font-family="Arial,sans-serif">
    <text x="20" y="24" fill="#eef5fb" font-size="12" font-weight="700">9:41</text><text x="328" y="24" fill="#eef5fb" font-size="12">●  ▰  95</text>
    <path d="m22 52-8 8 8 8" fill="none" stroke="#eaf0f3" stroke-width="2.5"/><text x="40" y="66" fill="#c0c8cc" font-size="12">Settings</text>
    <text x="20" y="105" fill="#f5f7fa" font-size="20" font-weight="700">Speaking Recognition Options</text>
    <text x="20" y="135" fill="#aeb9be" font-size="11">Adjust speech matching and response timing.</text>
    <rect x="16" y="156" width="358" height="137" rx="18" fill="#242627"/>
    <text x="32" y="187" fill="#e9edef" font-size="13" font-weight="700">Min. Similarity (%)</text><text x="354" y="187" fill="#49c4e9" font-size="15" font-weight="700" text-anchor="end">90</text>
