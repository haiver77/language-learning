<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="title desc">
  <title id="title">Cerebro corredor de perfil</title><desc id="desc">Un cerebro rosado inclinado hacia delante corre con una zancada viva; se conservan nubes, suelo móvil, brazos y piernas animados.</desc>
  <style>
    .sky{animation:drift 5.3s linear infinite}.runner{transform-box:fill-box;transform-origin:center;animation:lean .38s ease-in-out infinite alternate}.arm{transform-box:view-box;animation:swing .38s ease-in-out infinite alternate}
    .arm-left{transform-origin:133px 143px}.arm-right{transform-origin:271px 140px}.leg{transform-box:view-box}.leg-left{transform-origin:178px 218px;animation:back .38s ease-in-out infinite alternate}.leg-right{transform-origin:225px 215px;animation:front .38s ease-in-out infinite alternate}.reverse{animation-direction:alternate-reverse}.ground{animation:ground .417s linear infinite}
    @keyframes drift{to{transform:translateX(-400px)}}@keyframes ground{to{stroke-dashoffset:35}}@keyframes lean{to{transform:translate(4px,-6px) rotate(5deg)}}@keyframes swing{to{transform:rotate(32deg)}}@keyframes back{to{transform:rotate(-22deg)}}@keyframes front{to{transform:rotate(22deg)}}
    @media(prefers-reduced-motion:reduce){.sky,.runner,.arm,.leg,.ground{animation:none}}
  </style>
  <rect width="400" height="320" fill="#fff9f1"/><g class="sky" fill="#f8d9cf" opacity=".8"><g><path d="M25 69c0-10 8-18 18-18 4-15 26-18 34-4 14-3 23 14 13 24H29z"/><path d="M207 43c0-9 7-16 16-16 5-15 25-16 32-3 15-2 23 15 13 24h-55z"/><path d="M324 95c0-8 7-15 15-15 4-12 21-14 28-2 12-2 19 12 11 20h-50z"/></g><g transform="translate(400)"><path d="M25 69c0-10 8-18 18-18 4-15 26-18 34-4 14-3 23 14 13 24H29z"/><path d="M207 43c0-9 7-16 16-16 5-15 25-16 32-3 15-2 23 15 13 24h-55z"/><path d="M324 95c0-8 7-15 15-15 4-12 21-14 28-2 12-2 19 12 11 20h-50z"/></g></g>
  <path d="M0 266h400" stroke="#f4d8c8" stroke-width="3"/><path class="ground" d="M0 279h400" stroke="#e9b99b" stroke-width="5" stroke-dasharray="10 25"/><ellipse cx="204" cy="271" rx="88" ry="10" fill="#f1d8cb"/>
  <g class="runner">
    <g transform="translate(11)"><g class="leg leg-left" fill="none" stroke="#e98b83" stroke-width="14" stroke-linecap="round"><path d="M178 218q-4 30-28 40"/><path d="M148 258q-17 1-17 13 0 8 16 8h20q10-2 5-10z" fill="#ffd087" stroke-width="5"/></g></g>
    <g transform="translate(-11)"><g class="leg leg-right" fill="none" stroke="#d97871" stroke-width="14" stroke-linecap="round"><path d="M225 215q12 36 40 38"/><path d="M265 248q15-9 22 0 7 8-2 16l-19 13q-9 5-14-3l-7-15z" fill="#ffd087" stroke-width="5"/></g></g>
    <g class="arm arm-left reverse" fill="none" stroke="#ee9c92" stroke-width="12" stroke-linecap="round"><path d="M133 143q-25-10-37-29"/><circle cx="92" cy="111" r="8" fill="#ffc4b7" stroke-width="4"/></g><g class="arm arm-right" fill="none" stroke="#ee9c92" stroke-width="12" stroke-linecap="round"><path d="M271 140q24-8 35-27"/><circle cx="307" cy="109" r="8" fill="#ffc4b7" stroke-width="4"/></g>
    <path d="M143 105c-2-19 14-31 32-29 8-19 30-25 46-13 17-17 43-12 50 8 19 0 31 16 25 32 15 13 12 33-4 41-1 20-20 30-38 22-13 20-40 20-52 3-19 10-41-1-42-21-19-3-28-22-17-37z" fill="#ffb5ad" stroke="#d66f76" stroke-width="6" stroke-linejoin="round"/>
    <path d="M172 89q13 6 6 17t8 16m24-33q-8 9 2 17t-1 17m26-25q-8 10 2 18t-1 16m29 0q-13 3-10 14m-76 9q13-8 8-17m42 19q-8-10 0-18" fill="none" stroke="#ed8e87" stroke-width="5" stroke-linecap="round"/>
