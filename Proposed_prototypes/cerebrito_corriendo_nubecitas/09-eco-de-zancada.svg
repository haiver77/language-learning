<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="title desc">
  <title id="title">Cerebro con eco de zancada</title><desc id="desc">Un cerebro corredor con lóbulos marcados avanza en una zancada más amplia, con ecos gráficos discretos a su espalda y el mismo escenario de nubes y piso animado.</desc>
  <style>.sky{animation:drift 5.3s linear infinite}.runner{transform-box:fill-box;transform-origin:center;animation:dash .38s ease-in-out infinite alternate}.arm{transform-box:view-box;animation:swing .38s ease-in-out infinite alternate}.arm-left{transform-origin:133px 143px}.arm-right{transform-origin:271px 140px}.leg{transform-box:view-box}.leg-left{transform-origin:178px 218px;animation:back .38s ease-in-out infinite alternate}.leg-right{transform-origin:225px 215px;animation:front .38s ease-in-out infinite alternate}.reverse{animation-direction:alternate-reverse}.ground{animation:ground .417s linear infinite}.echo{animation:echo .38s ease-in-out infinite alternate}@keyframes drift{to{transform:translateX(-400px)}}@keyframes ground{to{stroke-dashoffset:35}}@keyframes dash{to{transform:translate(4px,-6px) rotate(2deg)}}@keyframes swing{to{transform:rotate(32deg)}}@keyframes back{to{transform:rotate(-25deg)}}@keyframes front{to{transform:rotate(25deg)}}@keyframes echo{to{opacity:.18;transform:translateX(-8px)}}@media(prefers-reduced-motion:reduce){.sky,.runner,.arm,.leg,.ground,.echo{animation:none}}</style>
