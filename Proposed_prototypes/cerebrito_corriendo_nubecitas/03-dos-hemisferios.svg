<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="title desc">
  <title id="title">Cerebro de dos hemisferios corredor</title><desc id="desc">Un cerebro bebé con hemisferios y surco central visibles corre con expresión alegre, entre nubes y marcas de pista animadas.</desc>
  <style>
    .sky{animation:drift 5.3s linear infinite}.runner{transform-box:fill-box;transform-origin:center;animation:bob .38s ease-in-out infinite alternate}.arm{transform-box:view-box;animation:swing .38s ease-in-out infinite alternate}.arm-left{transform-origin:133px 143px}.arm-right{transform-origin:271px 140px}.leg{transform-box:view-box}.leg-left{transform-origin:178px 218px;animation:back .38s ease-in-out infinite alternate}.leg-right{transform-origin:225px 215px;animation:front .38s ease-in-out infinite alternate}.reverse{animation-direction:alternate-reverse}.ground{animation:ground .417s linear infinite}
    @keyframes drift{to{transform:translateX(-400px)}}@keyframes ground{to{stroke-dashoffset:35}}@keyframes bob{to{transform:translateY(-8px) rotate(-2deg)}}@keyframes swing{to{transform:rotate(27deg)}}@keyframes back{to{transform:rotate(-18deg)}}@keyframes front{to{transform:rotate(18deg)}}
    @media(prefers-reduced-motion:reduce){.sky,.runner,.arm,.leg,.ground{animation:none}}
  </style>
