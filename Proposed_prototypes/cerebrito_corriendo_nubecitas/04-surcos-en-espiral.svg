<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="title desc">
  <title id="title">Cerebro de surcos en espiral</title><desc id="desc">Un alegre cerebro corredor muestra surcos curvos en espiral sobre sus lóbulos; sus extremidades, las nubes y el piso mantienen su animación de carrera.</desc>
