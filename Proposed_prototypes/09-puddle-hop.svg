<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="title desc">
  <title id="title">Puddle-hop baby brain</title>
  <desc id="desc">A delighted little brain bounds from one foot to the other, with a soft oval beneath marking each landing.</desc>
  <style>
    .figure{transform-box:fill-box;transform-origin:center;animation:hop .66s cubic-bezier(.3,0,.7,1) infinite}
    .leg1{transform-box:fill-box;transform-origin:top center;animation:foot .66s ease-in-out infinite alternate}
    .leg2{transform-box:fill-box;transform-origin:top center;animation:foot .66s ease-in-out infinite alternate-reverse}
    .landing{transform-box:fill-box;transform-origin:center;animation:land .66s ease-in-out infinite}
    @keyframes hop{0%,100%{transform:translateY(3px)}50%{transform:translateY(-23px) rotate(-3deg)}}
    @keyframes foot{to{transform:rotate(35deg)}} @keyframes land{0%,100%{transform:scaleX(1);opacity:.45}50%{transform:scaleX(.65);opacity:.22}}
    @media(prefers-reduced-motion:reduce){.figure,.leg1,.leg2,.landing{animation:none}}
  </style>
  <ellipse class="landing" cx="201" cy="285" rx="83" ry="11" fill="#d8a4a0"/>
  <g class="leg2" fill="none" stroke="#d97871" stroke-width="16" stroke-linecap="round"><path d="M174 224q-6 31-28 39"/><path d="M148 259q-14 2-13 12 0 9 18 8l22-4q8-2 5-9l-17-12z" fill="#ffd18a" stroke-width="5"/></g>
  <g class="leg1" fill="none" stroke="#e88478" stroke-width="17" stroke-linecap="round"><path d="M230 221q13 28 39 21"/><path d="M267 238q12-12 21-4 7 8-1 16l-19 17q-9 7-15-1l-9-17z" fill="#ffd18a" stroke-width="5"/></g>
  <g class="figure">
    <path d="M139 165q-17 14-24 27m142-30q19-9 26-23" fill="none" stroke="#ed978d" stroke-width="15" stroke-linecap="round"/>
    <circle cx="114" cy="193" r="8" fill="#ffc5b6"/><circle cx="285" cy="136" r="8" fill="#ffc5b6"/>
    <path d="M119 126c-8-22 8-39 29-40 5-28 37-41 59-24 19-25 55-17 63 10 27-1 43 23 30 45 18 14 14 42-7 50 7 28-13 48-40 43-14 24-46 25-62 6-24 17-54 4-56-22-25-3-37-29-24-49-13-5-17-12-12-19z" fill="#ffb5ad" stroke="#d97871" stroke-width="6" stroke-linejoin="round"/>
    <path d="M155 103q-7 14 6 22m22-40q-4 14 8 20m28-30q-9 12 0 24m29-12q-12 10-5 22m30 7q-14 4-15 17m15 26q-14-6-23 4m-24 21q-4-14-17-13m-37 12q7-12 0-22" fill="none" stroke="#f08e87" stroke-width="5" stroke-linecap="round"/>
    <path d="M180 146q7-8 15 0m31 0q8-8 16 0" fill="none" stroke="#9e5961" stroke-width="4" stroke-linecap="round"/>
    <path d="M194 158q16 22 34 0q-3 20-18 20t-16-20z" fill="#9e4e58"/>
    <ellipse cx="166" cy="163" rx="10" ry="6" fill="#f28e91"/><ellipse cx="260" cy="163" rx="10" ry="6" fill="#f28e91"/>
  </g>
  <path d="M77 106v19m-9-9h18m243 94v17m-8-8h16" stroke="#f2b66f" stroke-width="5" stroke-linecap="round"/>
</svg>
