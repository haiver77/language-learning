<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="title desc">
  <title id="title">Primeras mancuernas del corazón bebé</title>
  <desc id="desc">El corazoncito con cinta y muñequeras levanta pesitas redondas y ligeras en un movimiento simultáneo de abajo hacia arriba.</desc>
  <style>
    .upperL,.upperR,.foreL,.foreR{transform-box:view-box}
    .upperL{transform-origin:145px 157px;animation:upL 1.55s ease-in-out infinite}.upperR{transform-origin:255px 157px;animation:upR 1.55s ease-in-out infinite}
    .foreL{transform-origin:120px 191px;animation:foreL 1.55s ease-in-out infinite}.foreR{transform-origin:280px 191px;animation:foreR 1.55s ease-in-out infinite}
    .toy{transform-box:fill-box;transform-origin:center;animation:wiggle 1.55s ease-in-out infinite}
    @keyframes upL{0%,100%{transform:rotate(0)}48%,65%{transform:rotate(45deg)}}@keyframes upR{0%,100%{transform:rotate(0)}48%,65%{transform:rotate(-45deg)}}
    @keyframes foreL{0%,100%{transform:rotate(0)}48%,65%{transform:rotate(135deg)}}@keyframes foreR{0%,100%{transform:rotate(0)}48%,65%{transform:rotate(225deg)}}
    @keyframes wiggle{50%{transform:rotate(6deg)}}
    @media(prefers-reduced-motion:reduce){.upperL,.upperR,.foreL,.foreR,.toy{animation:none}}
  </style>
  <rect width="400" height="320" rx="28" fill="#fff9f1"/>
  <g transform="translate(200 160) scale(1.1) translate(-200 -160)">
    <ellipse cx="200" cy="282" rx="92" ry="10" fill="#f3ddd2"/><path d="M178 233l-14 35m58-35 14 35" fill="none" stroke="#dc7d7a" stroke-width="14" stroke-linecap="round"/><path d="M149 268h27m48 0h27" stroke="#c97871" stroke-width="5" stroke-linecap="round"/>
    <path d="M200 238c-24-20-83-60-83-101 0-27 21-47 47-47 16 0 29 8 37 22 9-17 25-25 43-22 28 4 43 29 37 54-8 34-52 70-81 94z" fill="#ff9e9f" stroke="#d96f79" stroke-width="6" stroke-linejoin="round"/><path d="M151 191q49 18 98-3l-12 22q-37 18-75-1z" fill="#ffe4c8"/>
    <ellipse cx="181" cy="139" rx="4" ry="7" fill="#513b43"/><ellipse cx="220" cy="139" rx="4" ry="7" fill="#513b43"/><ellipse cx="163" cy="151" rx="9" ry="5" fill="#f27f88"/><ellipse cx="238" cy="151" rx="9" ry="5" fill="#f27f88"/><path d="M190 156q11 14 22 0" fill="none" stroke="#a8515c" stroke-width="4" stroke-linecap="round"/>
    <path d="M139 119q61-40 122 0l-4 12q-56-29-114 0z" fill="#83b9aa" stroke="#5d9589" stroke-width="3"/>
    <g class="upperL" fill="none" stroke="#ed9b91" stroke-width="15" stroke-linecap="round"><path d="M145 157q-18 10-25 34"/></g><g class="upperR" fill="none" stroke="#ed9b91" stroke-width="15" stroke-linecap="round"><path d="M255 157q18 10 25 34"/></g>
    <g class="upperL"><g class="foreL" fill="none" stroke="#ed9b91" stroke-width="14" stroke-linecap="round"><path d="M120 191v42"/><circle cx="120" cy="234" r="8" fill="#ffc4b7" stroke-width="4"/><path d="M110 232h20" stroke="#83b9aa" stroke-width="8"/><g class="toy"><path d="M120 244h24" stroke="#84b9b2" stroke-width="12"/><circle cx="114" cy="244" r="12" fill="#a8d7ce" stroke="#6eaaa1" stroke-width="3"/><circle cx="150" cy="244" r="12" fill="#a8d7ce" stroke="#6eaaa1" stroke-width="3"/><path d="M108 239l9 10m27-10 9 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g></g></g>
    <g class="upperR"><g class="foreR" fill="none" stroke="#ed9b91" stroke-width="14" stroke-linecap="round"><path d="M280 191v42"/><circle cx="280" cy="234" r="8" fill="#ffc4b7" stroke-width="4"/><path d="M270 232h20" stroke="#83b9aa" stroke-width="8"/><g class="toy"><path d="M280 244h24" stroke="#84b9b2" stroke-width="12"/><circle cx="274" cy="244" r="12" fill="#a8d7ce" stroke="#6eaaa1" stroke-width="3"/><circle cx="310" cy="244" r="12" fill="#a8d7ce" stroke="#6eaaa1" stroke-width="3"/><path d="M268 239l9 10m27-10 9 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g></g></g>
  </g>
</svg>
