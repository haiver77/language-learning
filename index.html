      // --- Voices population ---
      function populateVoices() {
        const voices = speechSynthesis.getVoices();
        const [l1, l2] = getSelectedLangCodes();
        const slots = [{ pos: 1, code: l1 }, { pos: 2, code: l2 }];
        for (const s of slots) {
          const sel = els.voices[s.pos];
          const prev = sel.value;
          sel.innerHTML = '';
          const k = s.code;
          const guessList = (langMeta[k] && Array.isArray(langMeta[k].localeGuess)) ? langMeta[k].localeGuess : [k];
          let matching = voices.filter(v => v.lang && guessList.some(gl => v.lang.startsWith(gl)));
          if (matching.length === 0) matching = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(k));

          // If still no matching voices by language, fall back to showing all available voices
          let showedFallbackNotice = false;
          if (matching.length === 0 && voices.length > 0) {
            matching = voices.slice();
            showedFallbackNotice = true;
          }

          if (matching.length > 0) {
            if (showedFallbackNotice) {
              const note = document.createElement('option');
              note.value = '';
              note.disabled = true;
              note.selected = true;
              note.textContent = `(no language-specific voices found for ${k}; showing all voices)`;
              sel.appendChild(note);
            }
            for (const v of matching) {
              const opt = document.createElement('option');
              // prefer voiceURI when available (more likely unique), fall back to name
              opt.value = v.voiceURI || v.name || '';
              opt.textContent = `${v.name || '(unknown)'} (${v.lang || '??'})`;
              sel.appendChild(opt);
            }
            const guess = matching.find(v => langMeta[k] && langMeta[k].localeGuess && langMeta[k].localeGuess.some(gl => v.lang && v.lang.startsWith(gl)));
            if (guess) sel.value = guess.voiceURI || guess.name;
            if (!sel.value && sel.options.length) sel.selectedIndex = 0;
            if (prev && [...sel.options].some(o => o.value === prev)) sel.value = prev;
            if (savedConfig && savedConfig.voices && savedConfig.voices[k]) {
              const want = savedConfig.voices[k];
              if ([...sel.options].some(o => o.value === want)) sel.value = want;
            }
          } else {
            const opt = document.createElement('option');
            opt.value = '';
            opt.disabled = true;
            opt.selected = true;
            opt.textContent = '(no voices available)';
            sel.appendChild(opt);
          }
        }
      }

      // Attempt to force voice loading when user requests it (user gesture required on some browsers)
      function refreshVoices() {
        try {
          // Try to populate immediately
          populateVoices();
          const vs = speechSynthesis.getVoices();
          if (!vs || vs.length === 0) {
            // Listen once for the voiceschanged event
            if ('onvoiceschanged' in speechSynthesis) {
              const once = () => { try { populateVoices(); } catch {} finally { speechSynthesis.onvoiceschanged = null; } };
              speechSynthesis.onvoiceschanged = once;
            }
            // Try a silent user-initiated utterance to nudge some engines (volume 0)
            try {
              const u = new SpeechSynthesisUtterance('Initializing voices');
              u.volume = 0; u.rate = 1; u.pitch = 1;
              speechSynthesis.speak(u);
            } catch (e) { /* ignore */ }
            // fallback populate after short delay
            setTimeout(() => { try { populateVoices(); } catch (e) {} }, 700);
          }
        } catch (e) { console.warn('refreshVoices failed', e); }
      }

          try {
            if (els.csvBoxViewerDisplay) {
              els.csvBoxViewerDisplay.scrollTop = els.csvBox.scrollTop;
              els.csvBoxViewerDisplay.scrollLeft = els.csvBox.scrollLeft;
            }
          } catch (e) { /* ignore */ }
          // Persist selection and CSV content
          try { saveConfig(); } catch (e) { /* ignore */ }

          if (parsedRows.length) {
            await selectAndShowNextRow({ speak: false });
          }
        } catch {
          // ignore
        }
      }

      // --- Prompt - OpenAI integration ---
      function buildAIPrompt(level, topic, quantity, minWords) {
        const q = Number.isFinite(Number(quantity)) ? Number(quantity) : 40;
        const m = Number.isFinite(Number(minWords)) ? Number(minWords) : 15;
        const [l1, l2] = getSelectedLangCodes();
        const label1 = (langMeta[l1] && langMeta[l1].label) || l1;
        const label2 = (langMeta[l2] && langMeta[l2].label) || l2;
        return `Generate a plain text list of ${q} lines about "${topic}". Each line must contain two phrases separated by a semicolon (";") in this exact order: ${label1}; ${label2}.
  Requirements:
   - Each phrase must contain at least ${m} words.
   - Vocabulary and grammar must match CEFR level "${level}".
   - Do not include numbering, bullet points nor bullet lines, blank lines, or any extra text before or after the list.
       - Before returning the response, confirm that each line follows the exact language order: ${label1}; ${label2}.
   - Output only the list (no commentary, no labels, no metadata).

  Quick example of required line format
      - "Example in ${label1} with five words; Example in ${label2} with five words"`;
      } 

      async function callOpenAI(token, prompt) {
        const url = 'https://api.openai.com/v1/chat/completions';
        const body = {
          model: 'gpt-3.5-turbo',
          messages: [{ role: 'user', content: prompt }],
          temperature: 0.7,
          max_tokens: 4000,
        };
        const res = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token,
          },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          const txt = await res.text();
          throw new Error(txt || `OpenAI error ${res.status}`);
        }
        const j = await res.json();
        return (j.choices && j.choices[0] && (j.choices[0].message?.content || j.choices[0].text)) || '';
      }

      async function loadFromAI() {
        const token = (els.openaiToken.value || '').trim();
        const level = (els.aiLevel.value || 'A1');
        const topic = (els.aiTopic.value || '').trim() || 'general';
        const quantity = parseInt(els.aiQuantity.value || '40', 10) || 40;
        const minWords = parseInt(els.aiMinWords?.value || '15', 10) || 15;
        if (!token) { alert('Please enter your OpenAI token in OPEN_AI_TOKEN.'); return; }
        els.btnLoadAI.disabled = true;
        els.aiStatus.textContent = 'Loading…';
        try {
          // persist token locally for convenience
          try { localStorage.setItem('openai_token', token); } catch { }
          const prompt = buildAIPrompt(level, topic, quantity, minWords);
          const content = await callOpenAI(token, prompt);
          // Put response into csvBox
          els.csvBox.value = (content || '').trim();
          try { applyCsvWrap(); } catch (e) { /* ignore */ }
          ensureParsed();
          try { renderCsvViewer(); } catch (e) { /* ignore */ }
          try {
            if (els.csvBoxViewerDisplay) {
              els.csvBoxViewerDisplay.scrollTop = els.csvBox.scrollTop;
              els.csvBoxViewerDisplay.scrollLeft = els.csvBox.scrollLeft;
            }
          } catch (e) { /* ignore */ }
          // Show first item silently so UI updates
          if (parsedRows.length) await selectAndShowNextRow({ speak: false });
          els.aiStatus.textContent = 'Loaded';
        } catch (err) {
          console.error('OpenAI load error', err);
          alert('OpenAI error: ' + (err.message || err));
          els.aiStatus.textContent = 'Error';
        } finally {
          els.btnLoadAI.disabled = false;
        }
      }

      function startSelectedMode() {
        const mode = els.modeSelect?.value || 'Manual Mode';
        if (mode === 'Speaking Practice Mode') {
          stopManualPlaybackLoop();
          startSpeakingPractice();
          return;
        }
        if (mode === 'Writing Practice Mode') {
          stopManualPlaybackLoop();
          startWritingPractice();
          return;
        }
        if (mode === 'Auto Mode') {
          stopManualPlaybackLoop();
          const startBtn = els.modeContent?.querySelector('#autoStart');
          if (startBtn) startBtn.click();
          return;
        }
        stopManualPlaybackLoop();
        startManualPlaybackLoop();
      }

      function stopSelectedMode() {
        const mode = els.modeSelect?.value || 'Manual Mode';
        if (mode === 'Speaking Practice Mode') {
          stopManualPlaybackLoop();
          stopSpeakingPractice();
          return;
        }
        if (mode === 'Writing Practice Mode') {
          stopManualPlaybackLoop();
          stopWritingPractice();
          return;
        }
        if (mode === 'Auto Mode') {
          stopManualPlaybackLoop();
          const stopBtn = els.modeContent?.querySelector('#autoStop');
          if (stopBtn) stopBtn.click();
          return;
        }
        stopManualPlaybackLoop();
      }

      // --- Event wiring ---
      function bindEvents() {
        const sheet = document.getElementById('bottomSheet');
        const sheetBackdrop = document.getElementById('sheetBackdrop');
        const navItems = document.querySelectorAll('.nav-item');
        const fullPageSheets = new Set(['settings', 'load', 'csv']);
        const openSheet = (sheetKey) => {
          const isAlreadyOpen = sheet && sheet.classList.contains('open') && document.querySelector('.sheet-panel.active')?.dataset.panel === sheetKey;
          if (isAlreadyOpen) {
            closeSheet();
            return;
          }
          document.querySelectorAll('.sheet-panel').forEach(panel => {
            panel.classList.toggle('active', panel.dataset.panel === sheetKey);
          });
          navItems.forEach(item => item.classList.toggle('active', item.dataset.sheet === sheetKey));
          if (sheet) {
            sheet.classList.toggle('settings-page', fullPageSheets.has(sheetKey));
            sheet.classList.add('open');
            sheet.style.transition = '';
            sheet.style.transform = '';
          }
          if (sheetBackdrop) {
            sheetBackdrop.classList.toggle('visible', !fullPageSheets.has(sheetKey));
          }
        };
        const closeSheet = () => {
          if (sheet) {
            sheet.classList.remove('open');
            sheet.classList.remove('settings-page');
            sheet.style.transition = '';
            sheet.style.transform = '';
          }
          if (sheetBackdrop) sheetBackdrop.classList.remove('visible');
          navItems.forEach(item => item.classList.remove('active'));
          document.querySelectorAll('.sheet-panel').forEach(panel => panel.classList.remove('active'));
        };

        const dragState = { active: false, startY: 0, currentY: 0 };
        const handleSheetDrag = (event) => {
          if (!sheet || !sheet.classList.contains('open') || !dragState.active) return;
          dragState.currentY = event.clientY;
          const delta = Math.max(0, dragState.currentY - dragState.startY);
          if (sheet.classList.contains('settings-page')) {
            sheet.style.transform = 'translateY(' + delta + 'px)';
          } else {
            sheet.style.transform = 'translateX(-50%) translateY(' + delta + 'px)';
          }
        };

        const stopSheetDrag = () => {
          if (!dragState.active || !sheet) return;
          const delta = Math.max(0, dragState.currentY - dragState.startY);
          dragState.active = false;
          sheet.style.transition = '';
          if (delta > Math.min(140, window.innerHeight * 0.2)) {
            closeSheet();
            return;
          }
          sheet.style.transform = '';
        };

        if (sheet) {
          sheet.addEventListener('pointerdown', (event) => {
            if (!sheet.classList.contains('open')) return;
            const interactiveSelector = 'button, input, select, textarea, label, a, .panel-title, .accordion-trigger';
            if (event.target.closest(interactiveSelector)) return;
            dragState.active = true;
            dragState.startY = event.clientY;
            dragState.currentY = event.clientY;
            sheet.style.transition = 'none';
            sheet.setPointerCapture?.(event.pointerId);
          });
          sheet.addEventListener('pointermove', handleSheetDrag);
          sheet.addEventListener('pointerup', stopSheetDrag);
          sheet.addEventListener('pointercancel', stopSheetDrag);
          sheet.addEventListener('pointerleave', () => {
            if (dragState.active && dragState.currentY > dragState.startY) {
              stopSheetDrag();
            }
          });
        }

        navItems.forEach(item => {
          item.onclick = () => openSheet(item.dataset.sheet);
        });

        document.querySelectorAll('.mode-option').forEach((button) => {
          button.onclick = () => {
            const modeValue = button.dataset.mode;
            if (!modeValue) return;
            els.modeSelect.value = modeValue;
            document.querySelectorAll('.mode-option').forEach((item) => item.classList.toggle('active', item === button));
            renderModePanel();
            closeSheet();
          };
        });

        if (sheetBackdrop) sheetBackdrop.onclick = closeSheet;

        // Random button (global)
        if (els.btnRandom) els.btnRandom.onclick = async () => { await selectAndShowNextRow({ speak: true }); };
        if (els.btnFirst) els.btnFirst.onclick = async () => { await goToFirstRow({ speak: true }); };
        document.getElementById('btnStartAuto').onclick = () => {
          startSelectedMode();
        };
        document.getElementById('btnStopAuto').onclick = () => {
          stopSelectedMode();
        };
        document.getElementById('btnPrevPhrase').onclick = async () => {
          ensureParsed();
          if (!parsedRows.length) return;
          currentIndex = currentIndex <= 0 ? parsedRows.length - 1 : currentIndex - 1;
          setPhraseTexts(parsedRows[currentIndex]);
          applyShowVisibility();
          await speakCurrentRowSequence(++phraseSessionId, parsedRows[currentIndex]);
        };
        document.getElementById('btnNextPhrase').onclick = async () => {
          ensureParsed();
          if (!parsedRows.length) return;
          currentIndex = (currentIndex + 1) % parsedRows.length;
          setPhraseTexts(parsedRows[currentIndex]);
          applyShowVisibility();
          await speakCurrentRowSequence(++phraseSessionId, parsedRows[currentIndex]);
        };
        document.getElementById('randomToggle').onchange = () => {
          syncRandomToggleVisualState();
          syncRandomModeCheckboxes();
          saveConfig();
        };

        // Mode switching
        els.modeSelect.onchange = () => {
          // Stop timers/practices on switch
          if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
          stopSpeakingPractice();
          stopWritingPractice();
          document.querySelectorAll('.mode-option').forEach((item) => {
            item.classList.toggle('active', item.dataset.mode === els.modeSelect.value);
          });
          renderModePanel();
          closeSheet();
          saveConfig();
        };

        bindRandomModeCheckboxes();

        // Replay per language
        // Replay per slot
        els.replay[1].onclick = () => replaySlot(1);
        els.replay[2].onclick = () => replaySlot(2);

        // Show/Hide slots
        els.show[1].onchange = () => { applyShowVisibility(); saveConfig(); };
        els.show[2].onchange = () => { applyShowVisibility(); saveConfig(); };

        // Read slot checkboxes
        els.read[1].onchange = () => { saveConfig(); };
        els.read[2].onchange = () => { saveConfig(); };

        // Speaking threshold is shared by Settings and the mode panel.
        if (els.speakingMin) {
          els.speakingMin.oninput = () => updateSpeakingMinFromInput(els.speakingMin);
          els.speakingMin.onchange = () => updateSpeakingMinFromInput(els.speakingMin, true);
        }
        if (els.speakingWait) {
          els.speakingWait.oninput = () => {
            const wait = Math.max(1, Math.floor(Number(els.speakingWait.value) || 3));
            els.speakingWait.value = wait;
            const modeWait = els.modeContent.querySelector('#sp-wait');
            if (modeWait) modeWait.value = wait;
            saveConfig();
          };
        }
        if (els.speakingAfterMin) {
          els.speakingAfterMin.oninput = () => {
            const wait = Math.max(0, Math.floor(Number(els.speakingAfterMin.value) || 0));
            els.speakingAfterMin.value = wait;
            const modeWait = els.modeContent.querySelector('#sp-after-min');
            if (modeWait) modeWait.value = wait;
            saveConfig();
          };
        }

        // Font size
        const applyFont = () => {
          const px = Math.max(12, Math.min(50, parseInt(els.fontRange.value || '26', 10)));
          document.documentElement.style.setProperty('--phrase-font', px + 'px');
          els.fontValue.textContent = px + ' px';
        };
        els.fontRange.oninput = () => { applyFont(); saveConfig(); };

        // Theme toggle
        els.themeToggle.onchange = () => {
          const isDark = els.themeToggle.checked;
          document.body.classList.toggle('theme-light', !isDark);
          document.body.classList.toggle('theme-dark', isDark);
          saveConfig();
        };

        // CSV changes
        els.csvBox.oninput = () => { ensureParsed(); saveConfig(); };

        // Predefined
        els.btnLoadPredefined.onclick = async () => { await loadSelectedPredefined(); saveConfig(); };
        els.predefinedSelect.onchange = () => saveConfig();

        // File input
        els.fileInput.onchange = async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const text = await file.text();
          els.csvBox.value = text.trim();
          try { applyCsvWrap(); } catch (e) { /* ignore */ }
          ensureParsed();
          try { renderCsvViewer(); } catch (e) { /* ignore */ }
          try {
            if (els.csvBoxViewerDisplay) {
              els.csvBoxViewerDisplay.scrollTop = els.csvBox.scrollTop;
              els.csvBoxViewerDisplay.scrollLeft = els.csvBox.scrollLeft;
            }
          } catch (e) { /* ignore */ }
          await selectAndShowNextRow({ speak: false });
          saveConfig();
        };

        // Voices ready
        els.voices[1].onchange = () => saveConfig();
        els.voices[2].onchange = () => saveConfig();
        const refreshBtn = document.getElementById('refreshVoices');
        if (refreshBtn) refreshBtn.onclick = () => { refreshVoices(); };
        // Language selectors: update labels and voices when changed
        els.lang1Select.onchange = () => { updateLangLabels(); populateVoices(); ensureParsed(); selectAndShowNextRow({ speak: false }); renderModePanel(); saveConfig(); };
        els.lang2Select.onchange = () => { updateLangLabels(); populateVoices(); ensureParsed(); selectAndShowNextRow({ speak: false }); renderModePanel(); saveConfig(); };
        if (els.practiceLangSelect) {
          els.practiceLangSelect.onchange = () => {
            syncPracticeLanguageSelection(els.practiceLangSelect.value);
            saveConfig();
          };
        }
        if ('onvoiceschanged' in speechSynthesis) {
          speechSynthesis.onvoiceschanged = () => populateVoices();
        }
        // Rate / Pitch
        els.rate.onchange = () => saveConfig();
        els.pitch.onchange = () => saveConfig();
        // AI button
        els.btnLoadAI.onclick = loadFromAI;
        els.aiLevel.onchange = () => saveConfig();
        els.aiTopic.oninput = () => saveConfig();
        els.aiQuantity.onchange = () => saveConfig();
        if (els.aiMinWords) els.aiMinWords.onchange = () => saveConfig();
        // ensure viewer renders on initial bind
        try { renderCsvViewer(); } catch (e) { /* ignore */ }
      }

      // --- Init sample data ---
      function loadSamplePhrases() {
        const sample = [
          'Hola;Hello',
          'Buenos días;Good morning',
          '¿Cómo estás?;How are you?',
          'Gracias;Thank you',
          'Por favor;Please',
          'Lo siento;Sorry',
          '¿Dónde está el baño?;Where is the bathroom?',
          'Me gusta aprender idiomas;I like learning languages',
          '¿Cuánto cuesta?;How much is it?',
          'Hasta luego;See you later'
        ].join('\n');
        els.csvBox.value = sample;
        ensureParsed();
      }

      // --- Bootstrap ---
      function init() {
        // Load saved UI configuration first (if any)
        loadConfig();

        // Only load sample phrases when there's no saved CSV content
        if (!savedConfig || !savedConfig.csv) loadSamplePhrases();

        renderModePanel();
        initCollapsiblePanels();
        bindEvents();
        // ensure language labels are in-sync before populating voices
        updateLangLabels();
        applyShowVisibility();
        populateVoices();
        populatePredefinedList();

        // Initial phrase display (silent) so UI isn't empty
        selectAndShowNextRow({ speak: false });

        // Defaults only when no saved configuration
        if (!savedConfig) {
          els.themeToggle.checked = true;
          els.fontRange.value = 26;
          els.fontValue.textContent = '26 px';
        }
        // restore saved OpenAI token if any
        try { const t = localStorage.getItem('openai_token'); if (t) els.openaiToken.value = t; } catch { }

        // --- Debug panel for speaking-practice ---
        try {
          const dbg = document.createElement('div');
          dbg.className = 'row';
          dbg.style.marginTop = '8px';
          dbg.innerHTML = `
            <div class="panel">
              <div class="panel-title">SP Debug</div>
              <div style="display:flex;gap:8px;margin-bottom:8px">
                <button id="spDbgToggle">Toggle Log</button>
                <button id="spDbgClear">Clear</button>
                <button id="spDbgDownload">Download</button>
              </div>
              <pre id="sp-debug-log" style="max-height:200px;overflow:auto;background:var(--control-bg);color:var(--control-fg);padding:8px;border-radius:6px;margin:0"></pre>
            </div>`;
          document.querySelector('.container')?.appendChild(dbg);
          document.getElementById('spDbgToggle').onclick = () => { const el = document.getElementById('sp-debug-log'); if (!el) return; el.style.display = (el.style.display === 'none') ? 'block' : 'none'; };
          document.getElementById('spDbgClear').onclick = () => { window._trainer.logs = []; const el = document.getElementById('sp-debug-log'); if (el) el.textContent = ''; };
          document.getElementById('spDbgDownload').onclick = () => { const data = (window._trainer.logs || []).join('\n'); const blob = new Blob([data], { type: 'text/plain' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'sp_debug.log'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); };
        } catch (e) { /* ignore debug panel errors */ }
      }

      // Expose minimal for debugging (optional)
      window._trainer = { state: () => ({ currentIndex, phraseSessionId, parsedRowsCount: parsedRows.length }) };

      init();
    })();
  </script>
</body>
