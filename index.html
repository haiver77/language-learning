<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="learn_bible.ico" type="image/x-icon" />
  <style>
    :root {
      --bg: #e6e9ed;
      --panel: #f4f5f7;
      --surface: #ffffff;
      --surface-soft: #edf0f2;
      --surface-strong: #dfe5eb;
      --ink: #1a1d22;
      --muted: #58606d;
      --border: #d1d6dc;
      --primary: #2b8cff;
      --primary-soft: #daf0ff;
      --success: #2cc39c;
      --success-soft: #dffaf2;
      --danger: #ef5b5b;
      --shadow: rgba(17, 24, 39, 0.18);
      --focus: 0 0 0 3px rgba(43, 140, 255, 0.24);
      --phrase-font: 20px;
    }

    body.theme-dark {
      --bg: #111827;
      --panel: #0f172a;
      --surface: #111827;
      --surface-soft: #1f2937;
      --surface-strong: #374151;
      --ink: #e5e7eb;
      --muted: #94a3b8;
      --border: #334155;
      --primary: #60a5fa;
      --primary-soft: rgba(96, 165, 250, 0.18);
      --success: #34d399;
      --success-soft: rgba(52, 211, 153, 0.16);
      --danger: #f87171;
      --shadow: rgba(2, 6, 23, 0.44);
    }

    body.theme-light {
      --bg: #e6e9ed;
      --panel: #f4f5f7;
      --surface: #ffffff;
      --surface-soft: #edf0f2;
      --surface-strong: #dfe5eb;
      --ink: #1a1d22;
      --muted: #58606d;
      --border: #d1d6dc;
      --primary: #2b8cff;
      --primary-soft: #daf0ff;
      --success: #2cc39c;
      --success-soft: #dffaf2;
      --danger: #ef5b5b;
      --shadow: rgba(17, 24, 39, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      font-size: 10px;
      line-height: 1.3;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 0;
    }

    button, select, input, textarea {
      font: inherit;
    }

    .app-shell {
      width: min(100%, 760px);
      min-height: 100vh;
      background: var(--panel);
      border-left: 4px solid var(--surface-strong);
      border-right: 4px solid var(--surface-strong);
      box-shadow: 0 24px 50px var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .phone-frame {
      min-height: 100vh;
      padding-bottom: 0;
      position: relative;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 18px 8px;
    }

    .brand {
      font-weight: 900;
      font-size: 18px;
      letter-spacing: -0.04em;
      color: var(--ink);
      margin: 0;
    }

    .speaking-practice-panel,
    .writing-practice-panel {
      display: none;
      width: 100%;
      margin: 0 0 14px;
    }

    .speaking-practice-panel.visible,
    .writing-practice-panel.visible {
      display: block;
    }

    .speaking-practice-card,
    .writing-practice-card {
      background: var(--surface);
      border: 3px solid rgba(36, 180, 123, 0.9);
      border-radius: 26px;
      padding: 16px 18px 12px;
      box-shadow: inset 0 0 0 1px rgba(17,24,39,0.04);
      margin-bottom: 14px;
    }

    .speaking-practice-panel.visible,
    .writing-practice-panel.visible {
      padding-bottom: 10px;
    }

    .speaking-practice-card .status-row,
    .writing-practice-card .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
      color: var(--ink);
      font-weight: 800;
    }

    .speaking-practice-card .status-row .status {
      font-size: 1rem;
    }

    .ghost-button {
      display: none !important;
    }

    .main-view {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      min-height: calc(100vh - 86px);
      padding: 0 20px 0;
      padding-bottom: 150px;
    }

    #row-phrases {
      flex: 1;
      display: flex;
      align-items: flex-start;
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
    }

    .phrases {
      width: 100%;
      display: grid;
      gap: 18px;
      grid-template-columns: 1fr;
    }

    .phrase-line {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) 52px;
      align-items: center;
      justify-items: start;
      gap: 4px;
      min-height: 150px;
      background: rgba(255,255,255,0.62);
      border: 3px solid var(--success);
      border-radius: 28px;
      padding: 18px 18px 18px 10px;
      box-shadow: inset 0 0 0 1px rgba(17,24,39,0.04);
    }

    .lang-tag {
      display: inline-flex;
      justify-content: flex-start;
      align-items: center;
      min-height: 54px;
      font-size: 8px;
      font-weight: 900;
      color: var(--ink);
      letter-spacing: -0.06em;
      line-height: 1;
      user-select: none;
      padding-left: 0;
      width: 100%;
      margin-left: 0;
    }

    .phrase-text {
      width: 100%;
      justify-self: start;
      color: var(--ink);
      font-size: var(--phrase-font, 30px);
      font-weight: 900;
      letter-spacing: -0.04em;
      text-align: left;
      word-wrap: break-word;
      white-space: normal;
      line-height: 1.12;
      overflow-wrap: anywhere;
      margin-left: 0;
      padding-left: 0;
    }

    .phrase-word {
      display: inline;
      cursor: pointer;
      border-radius: 8px;
      padding: 0 0.08em;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    .phrase-word:hover,
    .phrase-word:focus-visible {
      background: rgba(74, 130, 224, 0.12);
      outline: none;
      transform: translateY(-1px);
    }

    .replay-btn {
      width: 40px;
      height: 40px;
      padding: 0;
      border: none;
      border-radius: 12px;
      background: linear-gradient(180deg, #67b9ff 0%, #3a98ec 100%);
      color: #fff;
      font-size: 1.6rem;
      line-height: 1;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 18px rgba(41, 104, 194, 0.3);
      cursor: pointer;
      font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
    }

    .replay-btn:hover { filter: brightness(1.03); }
    .replay-btn:focus { outline: 0; box-shadow: var(--focus), 0 8px 18px rgba(41, 104, 194, 0.3); }

    #btnStartAuto {
      font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
      font-size: 14px;
      line-height: 1;
      min-width: 52px;
      padding: 12px 16px;
      display: grid;
      place-items: center;
    }

    .transport-bar {
      position: fixed;
      left: 50%;
      bottom: 78px;
      transform: translateX(-50%);
      width: min(94vw, 760px);
      display: flex;
      flex-wrap: nowrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 0 8px;
      z-index: 10;
      pointer-events: auto;
    }

    .toggle-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      padding: 0;
      border: 2px solid var(--border);
      background: var(--surface);
      border-radius: 14px;
      color: var(--ink);
      font-weight: 800;
      box-shadow: 0 4px 16px rgba(17,24,39,0.04);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, transform 0.18s ease;
    }

    .toggle-pill .toggle-state {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .toggle-pill .toggle-icon {
      font-size: 18px;
      line-height: 1;
    }

    .toggle-pill.is-on {
      border-color: rgba(34, 197, 94, 0.9);
      background: rgba(34, 197, 94, 0.22);
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.14);
    }

    .toggle-pill.is-off {
      background: var(--surface);
      border-color: var(--border);
      color: var(--muted);
    }

    .toggle-pill input {
      display: none;
    }

    .action-btn,
    button {
      border: none;
      border-radius: 14px;
      background: var(--surface);
      border: 2px solid var(--border);
      color: var(--ink);
      font-weight: 800;
      padding: 12px 18px;
      min-height: 50px;
      cursor: pointer;
      box-shadow: none;
      font-size: 14px;
    }

    .action-btn.secondary,
    button.secondary {
      background: var(--surface);
      border: 2px solid var(--border);
      color: var(--ink);
      box-shadow: none;
    }

    body.theme-dark .action-btn.secondary,
    body.theme-dark button.secondary,
    body.theme-dark .badge,
    body.theme-dark .check,
    body.theme-dark .mode-option {
      background: rgba(15, 23, 42, 0.9);
      color: var(--ink);
      border-color: var(--border);
    }

    body.theme-dark .toggle-pill {
      background: rgba(15, 23, 42, 0.9);
      color: var(--ink);
      border-color: var(--border);
    }

    body.theme-dark .toggle-pill.is-on {
      background: rgba(34, 197, 94, 0.22);
      border-color: rgba(34, 197, 94, 0.9);
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.14);
    }

    body.theme-dark .phrase-line {
      background: rgba(15, 23, 42, 0.55);
    }

    body.theme-dark .sheet .panel-title {
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(96, 165, 250, 0.05));
    }

    body.theme-dark .sheet .panel-title:hover {
      background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(96, 165, 250, 0.08));
    }

    body.theme-dark #csvBox {
      background: rgba(15, 23, 42, 0.6);
    }

    .action-btn:focus, button:focus {
      outline: 0;
      box-shadow: var(--focus), 0 8px 16px rgba(44, 113, 201, 0.18);
    }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      background: rgba(15, 23, 42, 0.38);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
      z-index: 75;
    }

    .sheet-backdrop.visible {
      display: block;
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      position: fixed;
      left: 50%;
      bottom: 0;
      display: none;
      transform: translateX(-50%) translateY(calc(100% + 20px));
      width: min(92vw, 760px);
      height: min(94vh, calc(100vh - 12px));
      max-height: calc(100vh - 12px);
      background: var(--panel);
      border-radius: 30px 30px 0 0;
      box-shadow: 0 -20px 40px rgba(9, 16, 29, 0.22);
      border: 2px solid rgba(17,24,39,0.08);
      border-bottom: none;
      transition: transform .25s ease, opacity .2s ease, visibility 0s linear .2s;
      z-index: 90;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
    }

    .sheet.settings-page {
      left: 0;
      right: 0;
      bottom: 0;
      top: 0;
      width: 100vw;
      max-width: 100vw;
      height: 100vh;
      max-height: 100vh;
      border-radius: 0;
      border: none;
      transform: translateY(100%);
    }

    .sheet.open {
      display: block;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
      opacity: 1;
      visibility: visible;
      transition: transform .25s ease, opacity .2s ease, visibility 0s linear 0s;
    }

    .sheet.settings-page.open {
      transform: translateY(0);
    }

    .sheet-grab {
      width: 68px;
      height: 6px;
      border-radius: 999px;
      background: rgba(18, 20, 24, 0.2);
      margin: 10px auto 0;
      cursor: grab;
      touch-action: none;
    }

    .sheet-grab:active {
      cursor: grabbing;
    }

    .sheet-panel {
      display: none;
      padding: 12px 14px 18px;
      height: calc(100% - 52px);
      max-height: calc(100% - 52px);
      overflow-y: auto;
    }

    .sheet-panel[data-panel="csv"] {
      display: none;
      height: 100%;
      max-height: none;
      padding: 8px 12px 10px;
    }

    .sheet-panel[data-panel="csv"].active {
      display: flex;
      flex-direction: column;
    }

    .sheet-panel[data-panel="csv"] .row {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
      margin-bottom: 0;
      padding: 8px;
    }

    .sheet-panel[data-panel="csv"] .panel {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
      gap: 8px;
    }

    .sheet-panel.active {
      display: block;
    }

    .sheet-header {
      font-size: clamp(1.6rem, 4vw, 2.3rem);
      font-weight: 900;
      letter-spacing: -0.05em;
      margin: 8px 0 14px;
      color: var(--ink);
    }

    .sheet .container,
    .sheet .container2c {
      display: block;
      max-width: none;
      padding: 0;
      margin: 0;
    }

    .sheet .row {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
    }

    #row-load {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: stretch;
    }

    #row-load .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
    }

    #row-load .panel-title {
      margin-bottom: 8px;
    }

    #row-load .inline-controls {
      width: 100%;
      justify-content: center;
    }

    .sheet .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 0;
      margin-top: 0;
      overflow: hidden;
      transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
    }

    .sheet .panel.is-collapsible {
      box-shadow: inset 0 0 0 1px rgba(17,24,39,0.03);
    }

    .sheet .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 14px 16px;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.45), rgba(143, 182, 255, 0.08));
      color: var(--ink);
      font-size: 1.25rem;
      font-weight: 900;
      text-align: left;
      cursor: pointer;
      transition: background .2s ease;
    }

    .sheet .panel-title:hover {
      background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(143, 182, 255, 0.12));
    }

    .sheet .panel-title:focus-visible {
      outline: 0;
      box-shadow: inset 0 0 0 2px rgba(43, 140, 255, 0.35);
    }

    .sheet .panel-chevron {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(43, 140, 255, 0.1);
      color: var(--primary);
      font-size: 1.1rem;
      line-height: 1;
      transition: transform .2s ease;
      transform: rotate(0deg);
      flex-shrink: 0;
    }

    .sheet .panel.collapsed .panel-chevron {
      transform: rotate(-90deg);
    }

    .sheet .panel-content {
      padding: 12px 12px 14px;
      display: block;
    }

    .sheet .panel.collapsed .panel-content {
      display: none;
    }

    .sheet .inline-controls,
    .sheet .font-slider,
    .sheet .checks,
    .sheet .progress-line {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .sheet .checks {
      display: grid;
      grid-template-columns: repeat(2, minmax(140px, 1fr));
      gap: 12px;
    }

    .sheet .check {
      font-size: 1.3rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      min-height: 54px;
      width: 150px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255,255,255,0.75);
    }

    .sheet .check input {
      width: 20px;
      height: 20px;
      margin: 0;
      accent-color: var(--primary);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      color: var(--ink);
      font-weight: 700;
    }

    .sheet select,
    .sheet input[type="text"],
    .sheet input[type="password"],
    .sheet input[type="number"],
    .sheet input[type="file"],
    .sheet .textarea {
      font-size: 9px;
      min-height: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      padding: 6px 8px;
      width: 100%;
    }

    .sheet input[type="number"] {
      width: fit-content;
      min-width: 0;
      max-width: 100%;
      display: inline-block;
    }

    #aiTopic {
      font-size: 12px;
    }

    .sheet select,
    .sheet select option {
      color: var(--ink);
      background: var(--surface);
    }

    .sheet select,
    .sheet input[type="number"],
    .sheet input[type="file"] {
      font-size: 9px;
    }

    .sheet select {
      width: auto;
      min-width: 180px;
      height: 28px;
      line-height: 1.2;
      padding: 6px 10px;
      appearance: auto;
    }

    .tiny-button {
      min-height: 32px;
      height: 32px;
      padding: 6px 12px;
      font-size: 12px;
      line-height: 1.2;
      border-radius: 10px;
    }

    .title-with-action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .title-with-action .panel-title {
      margin-bottom: 0;
    }

    .sheet .textarea {
      min-height: 120px;
    }

    .sheet #csvBox {
      position: absolute;
      inset: 0;
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      min-height: 0;
      resize: none;
      z-index: 1;
      color: transparent;
      caret-color: var(--ink);
      background: rgba(255,255,255,0.74);
      white-space: pre;
      overflow: auto;
    }

    .csv-editor-shell {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
      gap: 10px;
    }

    .viewer-wrapper {
      position: relative;
      flex: 1 1 auto;
      width: 100%;
      min-height: 220px;
      height: min(74vh, 760px);
      max-height: calc(100vh - 300px);
      margin-top: 0;
      min-width: 0;
    }

    .csv-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 0;
    }

    #csvBoxViewerDisplay {
      position: absolute;
      inset: 0;
      overflow: auto;
      white-space: pre;
      word-wrap: break-word;
      padding: 10px;
      pointer-events: none;
      z-index: 2;
      box-sizing: border-box;
      background: transparent;
      color: transparent;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    #csvBoxViewerDisplay::-webkit-scrollbar {
      display: none;
    }

    #csvBoxViewerDisplay .viewer-line {
      display: block;
      position: relative;
      padding-right: calc(var(--ln-ch, 3ch) + 18px);
      min-height: 1.4em;
    }

    #csvBoxViewerDisplay .viewer-line .line-content {
      white-space: inherit;
      display: inline;
    }

    #csvBoxViewerDisplay .viewer-line .ln {
      position: absolute;
      right: 6px;
      top: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      color: var(--muted);
      font-size: inherit;
      opacity: 0.85;
      user-select: none;
      pointer-events: none;
    }

    .sheet #modeSelect {
      width: 100%;
      min-height: 64px;
      font-size: 1.15rem;
      font-weight: 800;
      padding-left: 16px;
      border-radius: 18px;
      background: #f1f5f9;
    }

    .mode-option-list {
      display: grid;
      gap: 12px;
      margin-top: 10px;
    }

    .mode-option {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      padding: 14px 18px;
      min-height: 58px;
      border-radius: 18px;
      border: 2px solid rgba(17,24,39,0.08);
      background: var(--surface);
      color: var(--ink);
      font-size: clamp(1.2rem, 3vw, 2rem);
      font-weight: 900;
      text-align: left;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
      cursor: pointer;
    }

    .mode-option.active {
      background: linear-gradient(180deg, var(--primary-soft), rgba(91, 175, 255, 0.08));
      border-color: rgba(43, 140, 255, 0.7);
      box-shadow: 0 0 0 2px rgba(43, 140, 255, 0.18);
    }

    .mode-option .emoji {
      width: 38px;
      text-align: center;
      font-size: 2rem;
      line-height: 1;
      display: inline-block;
    }

    .sheet #modeContent {
      width: 100%;
    }

    .sheet #modeContent .panel {
      margin-top: 14px;
    }

    (() => {

        writingPracticePanel: document.getElementById('writingPracticePanel'),
        csvBox: document.getElementById('csvBox'),
        csvBoxViewerDisplay: document.getElementById('csvBoxViewerDisplay'),
        color1: document.getElementById('color1'),
        color2: document.getElementById('color2'),
        wrapCsv: document.getElementById('wrapCsv'),
        predefinedSelect: document.getElementById('predefinedSelect'),
        btnLoadPredefined: document.getElementById('btnLoadPredefined'),
        fileInput: document.getElementById('fileInput'),
        fontRange: document.getElementById('fontRange'),
        fontValue: document.getElementById('fontValue'),
        themeToggle: document.getElementById('themeToggle'),
        voices: {
          1: document.getElementById('voice-1'),
          2: document.getElementById('voice-2'),
        },
        lang1Select: document.getElementById('lang1Select'),
        lang2Select: document.getElementById('lang2Select'),
        practiceLangSelect: document.getElementById('practiceLangSelect'),
        langTag: {
          1: document.getElementById('lang-tag-1'),
          2: document.getElementById('lang-tag-2'),
        },
        readLabel: { 1: document.getElementById('read-label-1'), 2: document.getElementById('read-label-2') },
        showLabel: { 1: document.getElementById('show-label-1'), 2: document.getElementById('show-label-2') },
        openaiToken: document.getElementById('openaiToken'),
        aiLevel: document.getElementById('aiLevel'),
        aiTopic: document.getElementById('aiTopic'),
        aiQuantity: document.getElementById('aiQuantity'),
        aiMinWords: document.getElementById('aiMinWords'),
        btnLoadAI: document.getElementById('btnLoadAI'),
        aiStatus: document.getElementById('aiStatus'),
        rate: document.getElementById('rate'),
        pitch: document.getElementById('pitch'),
        speakingMin: document.getElementById('sp-min-settings'),
        speakingWait: document.getElementById('sp-wait-settings'),
        speakingAfterMin: document.getElementById('sp-after-min-settings'),
      };

      const langMeta = {
        es: { localeGuess: ['es-ES', 'es-419', 'es-MX', 'es-AR', 'es-PE'], label: 'ES' },
        en: { localeGuess: ['en-US', 'en-GB', 'en-AU'], label: 'EN' },
        it: { localeGuess: ['it-IT'], label: 'IT' },
        pt: { localeGuess: ['pt-BR', 'pt-PT'], label: 'PT' },
        de: { localeGuess: ['de-DE', 'de-AT', 'de-CH'], label: 'DE' },
        fr: { localeGuess: ['fr-FR', 'fr-CA', 'fr-BE', 'fr-CH'], label: 'FR' },
      };
      //fr: { localeGuess: ['fr-FR','fr-CA','fr-BE','fr-CH'], label: 'FR' },
      //de: { localeGuess: ['de-DE','de-AT','de-CH'], label: 'DE' }


      let parsedRows = [];               // Array of objects keyed by selected language codes
      let currentIndex = -1;             // Index in parsedRows
      let phraseSessionId = 0;           // Monotonic token
      let autoTimer = null;              // Auto mode interval
      let manualPlaybackLoop = { active: false };
      let speakingPractice = {
        active: false,
        rec: null,
        lang: 'es',
        min: 90,
        liveTextEl: null,
        scoreEl: null,
        progressEl: null,
        statusEl: null,
        silenceCounterEl: null,
        advanceTimer: null,
        advanceInterval: null,
      };
      let writingPractice = {
        active: false,
        lang: 'es',
        inputEl: null,
        statusEl: null,
        scoreEl: null,
        remainingEl: null,
        writingBusy: false,
        currentWriteTarget: '',
      };
      let savedConfig = null;

      // --- Utilities ---
      function normalizeForCompare(s) {
        return (s || '')
          .toLowerCase()
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // strip diacritics
          .replace(/[^\p{L}\p{N}\s]/gu, ' ')               // remove punctuation
          .replace(/\s+/g, ' ')                            // collapse spaces
          .trim();
      }

      function levenshtein(a, b) {
        const m = a.length, n = b.length;
        if (m === 0) return n;
        if (n === 0) return m;
        const v0 = new Array(n + 1);
        const v1 = new Array(n + 1);
        for (let i = 0; i <= n; i++) v0[i] = i;
        for (let i = 0; i < m; i++) {
          v1[0] = i + 1;
          const ai = a.charCodeAt(i);
          for (let j = 0; j < n; j++) {
            const cost = ai === b.charCodeAt(j) ? 0 : 1;
            v1[j + 1] = Math.min(v1[j] + 1, v0[j + 1] + 1, v0[j] + cost);
          }
          for (let j = 0; j <= n; j++) v0[j] = v1[j];
        }
        return v0[n];
      }

      function similarityPercent(a, b) {
        const A = normalizeForCompare(a);
        const B = normalizeForCompare(b);
        if (!A && !B) return 100;
        const dist = levenshtein(A, B);
        const base = Math.max(A.length, B.length);
        const pct = Math.max(0, Math.round((1 - dist / base) * 100));
        return pct;
      }

      function normalizeSpeechChunk(s) {
        return (s || '').replace(/\s+/g, ' ').trim();
      }

      // Lightweight event logger for speaking-practice debugging
      window._trainer = window._trainer || {};
      window._trainer.logs = window._trainer.logs || [];
      function recordLog(msg) {
        try {
          const t = new Date().toISOString();
          const s = t + ' ' + String(msg || '');
          window._trainer.logs.push(s);
          // keep logs bounded
          if (window._trainer.logs.length > 2000) window._trainer.logs.shift();
          try { console.log('[SP-LOG]', s); } catch (e) {}
          const el = document.getElementById('sp-debug-log');
          if (el) {
            el.textContent = window._trainer.logs.slice(-200).join('\n');
            el.scrollTop = el.scrollHeight;
          }
        } catch (e) { /* ignore logging errors */ }
      }

      function isMobileSpeechBrowser() {
        try {
          const ua = navigator.userAgent || '';
          const coarse = typeof window.matchMedia === 'function' && window.matchMedia('(pointer: coarse)').matches;
          return /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || coarse;
        } catch (e) {
          return false;
        }
      }

      function getRecognitionStartDelayMs() {
        // Start recognition immediately after TTS finishes to reduce latency.
        return 0;
      }

      function setSilenceCounterText(value) {
        const modeCounterEl = els.modeContent && els.modeContent.querySelector ? els.modeContent.querySelector('#sp-silence-counter') : null;
        if (modeCounterEl) modeCounterEl.textContent = value;
        if (speakingPractice.silenceCounterEl) speakingPractice.silenceCounterEl.textContent = value;
      }

      function clearRecognitionTimers(rec) {
        if (!rec) return;
        if (rec._silenceTimer) { clearTimeout(rec._silenceTimer); rec._silenceTimer = null; }
        if (rec._silenceInterval) { clearInterval(rec._silenceInterval); rec._silenceInterval = null; }
        if (speakingPractice.advanceTimer) { clearTimeout(speakingPractice.advanceTimer); speakingPractice.advanceTimer = null; }
        if (speakingPractice.advanceInterval) { clearInterval(speakingPractice.advanceInterval); speakingPractice.advanceInterval = null; }
        setSilenceCounterText('');
        if (rec._startTimer) { clearTimeout(rec._startTimer); rec._startTimer = null; }
      }

      function startRecognitionWhenReady(rec, myToken) {
        if (!rec) return;
        if (rec._startTimer) { clearTimeout(rec._startTimer); rec._startTimer = null; }
        const delayMs = getRecognitionStartDelayMs();
        if (delayMs > 0 && speakingPractice.statusEl) {
          speakingPractice.statusEl.textContent = 'Waiting for microphone…';
        }
        recordLog('scheduling recognition start delayMs=' + delayMs + ' token=' + myToken);
        rec._startTimer = setTimeout(() => {
          rec._startTimer = null;
          if (!speakingPractice.active) { recordLog('start aborted: practice not active'); return; }
          if (speakingPractice.rec !== rec) { recordLog('start aborted: rec not current'); return; }
          if (myToken !== phraseSessionId) { recordLog('start aborted: token mismatch'); return; }
          if (speakingPractice.statusEl) speakingPractice.statusEl.textContent = 'Listening…';
          try { rec.start(); recordLog('rec.start() invoked token=' + myToken); } catch (err) { recordLog('rec.start() failed ' + (err && err.message)); }
        }, delayMs);
      }

      function collapseRepeatedTokenPatterns(tokens) {
        const cleaned = [];
        for (const token of tokens) {
          if (!token) continue;
          if (cleaned.length && cleaned[cleaned.length - 1] === token) continue;
          cleaned.push(token);
          const maxPattern = Math.min(4, Math.floor(cleaned.length / 2));
          for (let size = 1; size <= maxPattern; size++) {
            const a = cleaned.slice(cleaned.length - 2 * size, cleaned.length - size).join('\u0000');
            const b = cleaned.slice(cleaned.length - size).join('\u0000');
            if (a && a === b) {
              cleaned.splice(cleaned.length - size, size);
              break;
            }
          }
        }
        return cleaned;
      }

      function removeTokenOverlap(baseText, nextText) {
        const baseTokens = normalizeSpeechChunk(baseText).split(' ').filter(Boolean);
        const nextTokens = normalizeSpeechChunk(nextText).split(' ').filter(Boolean);
        if (!nextTokens.length) return '';

        let overlap = 0;
        const maxOverlap = Math.min(baseTokens.length, nextTokens.length);
        for (let size = maxOverlap; size > 0; size--) {
          let same = true;
          for (let i = 0; i < size; i++) {
            if (baseTokens[baseTokens.length - size + i] !== nextTokens[i]) {
              same = false;
              break;
            }
          }
          if (same) {
            overlap = size;
            break;
          }
        }

        const cleanedTokens = collapseRepeatedTokenPatterns(nextTokens.slice(overlap));
        if (baseTokens.length && cleanedTokens[0] === baseTokens[baseTokens.length - 1]) {
          cleanedTokens.shift();
        }
        return cleanedTokens.join(' ').trim();
      }

      function buildRecognitionText(rec, results) {
        const baseIndex = rec._resultBaseIndex || 0;
        const interimParts = [];
        let sawFinalInEvent = false;

        rec._lastResultsLength = results.length;
        for (let i = baseIndex; i < results.length; i++) {
          const res = results[i];
          const transcript = normalizeSpeechChunk(res && res[0] && res[0].transcript || '');
          if (!transcript) continue;
          if (res.isFinal) {
            rec._finalByIndex[i] = transcript;
            sawFinalInEvent = true;
          } else {
            interimParts.push(transcript);
          }
        }

        const finalText = Object.keys(rec._finalByIndex)
          .map(Number)
          .filter(index => index >= baseIndex)
          .sort((a, b) => a - b)
          .map(index => rec._finalByIndex[index])
          .join(' ')
          .replace(/\s+/g, ' ')
          .trim();

        const interimCombined = normalizeSpeechChunk(interimParts.join(' '));
        const interimSuffix = removeTokenOverlap(finalText, interimCombined);
        const liveText = [finalText, interimSuffix].filter(Boolean).join(' ').trim();

        return {
          finalText,
          interimSuffix,
          liveText,
          sawFinalInEvent,
          hasSpeech: !!liveText,
        };
      }

      function validateSpokenWords(target, spoken, threshold = 70) {
        const targetTokens = (target.match(/\S+/g) || []);
        const spokenTokens = (spoken.match(/\S+/g) || []);
        const matchedTarget = new Array(targetTokens.length).fill(false);
        const spokenCorrect = new Array(spokenTokens.length).fill(false);

        let cursor = 0;
        for (let i = 0; i < spokenTokens.length; i++) {
          const s = spokenTokens[i];
          let bestIdx = -1;
          let bestSim = -1;

          // Primary pass: find the best match ahead of the cursor.
          for (let j = cursor; j < targetTokens.length; j++) {
            const sim = similarityPercent(s, targetTokens[j]);
            if (sim >= threshold && sim > bestSim) {
              bestSim = sim;
              bestIdx = j;
              if (sim === 100) break;
            }
          }

          if (bestIdx >= 0) {
            spokenCorrect[i] = true;
            matchedTarget[bestIdx] = true;
            cursor = bestIdx + 1;
            continue;
          }

          // Repeat-tolerant fallback: if the spoken word exists anywhere
          // in the target phrase, keep it as correct without moving cursor.
          for (let j = 0; j < targetTokens.length; j++) {
            if (similarityPercent(s, targetTokens[j]) >= threshold) {
              spokenCorrect[i] = true;
              break;
            }
          }
        }

        const matchedCount = matchedTarget.reduce((acc, ok) => acc + (ok ? 1 : 0), 0);
        const score = targetTokens.length ? Math.round((matchedCount / targetTokens.length) * 100) : 0;

        return {
          targetTokens,
          spokenTokens,
          matchedTarget,
          spokenCorrect,
          score,
        };
      }

      // Compare target phrase and live transcript using forward matching and highlight target words.
      function compareAndHighlight(target, live, slotPos) {
        const validation = validateSpokenWords(target, live, 70);
        const container = els.text[slotPos];
        if (!container) return validation;
        container.innerHTML = '';
        for (let i = 0; i < validation.targetTokens.length; i++) {
          const span = document.createElement('span');
          span.textContent = validation.targetTokens[i];
          span.className = validation.matchedTarget[i] ? 'word-correct' : 'word-incorrect';
          container.appendChild(span);
          if (i !== validation.targetTokens.length - 1) container.appendChild(document.createTextNode(' '));
        }
        return validation;
      }

      function renderLiveValidation(live, spokenCorrect) {
        if (!speakingPractice.liveTextEl) return;
        const liveTokens = (live.match(/\S+/g) || []);
        if (!liveTokens.length) {
          speakingPractice.liveTextEl.textContent = '';
          return;
        }
        speakingPractice.liveTextEl.innerHTML = '';
        for (let i = 0; i < liveTokens.length; i++) {
          const span = document.createElement('span');
          span.textContent = liveTokens[i];
          span.className = spokenCorrect && spokenCorrect[i] ? 'word-correct' : 'word-incorrect';
          speakingPractice.liveTextEl.appendChild(span);
          if (i !== liveTokens.length - 1) speakingPractice.liveTextEl.appendChild(document.createTextNode(' '));
        }
      }

      function getSelectedLangCodes() {
        return [els.lang1Select.value, els.lang2Select.value];
      }

      function populatePracticeLanguageOptions() {
        const el = els.practiceLangSelect;
        if (!el) return;
        const [l1, l2] = getSelectedLangCodes();
        const values = [l1, l2];
        const prev = (el.value && values.includes(el.value)) ? el.value : values[0];
        el.innerHTML = '';
        for (const code of values) {
          const option = document.createElement('option');
          option.value = code;
          option.textContent = (langMeta[code] && langMeta[code].label) ? langMeta[code].label : code.toUpperCase();
          el.appendChild(option);
        }
        if (values.includes(prev)) {
          el.value = prev;
        } else {
          el.value = values[0];
        }
      }

      function getPracticeLanguage() {
        const [l1, l2] = getSelectedLangCodes();

        return [l1, l2].includes(candidate) ? candidate : l1;
      }

      function syncPracticeLanguageSelection(newLang) {
        const [l1, l2] = getSelectedLangCodes();
        const valid = [l1, l2].includes(newLang) ? newLang : l1;
        if (els.practiceLangSelect && [...els.practiceLangSelect.options].some(option => option.value === valid)) {
          els.practiceLangSelect.value = valid;

        const wrLangEl = els.modeContent && els.modeContent.querySelector ? els.modeContent.querySelector('#wr-lang') : null;
        if (spLangEl && [...spLangEl.options].some(option => option.value === valid)) {

        }
        if (wrLangEl && [...wrLangEl.options].some(option => option.value === valid)) {

      function updateLangLabels() {
        const [l1, l2] = getSelectedLangCodes();
        els.langTag[1].textContent = (langMeta[l1] && langMeta[l1].label) || l1.toUpperCase();
        els.langTag[2].textContent = (langMeta[l2] && langMeta[l2].label) || l2.toUpperCase();
        els.readLabel[1].textContent = (langMeta[l1] && langMeta[l1].label) || l1.toUpperCase();
        els.readLabel[2].textContent = (langMeta[l2] && langMeta[l2].label) || l2.toUpperCase();
        els.showLabel[1].textContent = (langMeta[l1] && langMeta[l1].label) || l1.toUpperCase();
        els.showLabel[2].textContent = (langMeta[l2] && langMeta[l2].label) || l2.toUpperCase();
        populatePracticeLanguageOptions();
        syncPracticeLanguageSelection(getPracticeLanguage());
      }

      function parseCSV(text) {
        const [l1, l2] = getSelectedLangCodes();
        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
        const rows = [];
        for (const line of lines) {
          const cols = parseCSVLine(line);
          if (cols.length >= 2) {
            const obj = {};
            obj[l1] = cols[0];
            obj[l2] = cols[1];
            rows.push(obj);
          }
        }
        return rows;
      }

      // Basic CSV line parser supporting double-quoted fields and escaped quotes "".
      function parseCSVLine(line) {
        const out = [];
        let cur = '';
        let inQ = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (inQ) {
            if (ch === '"') {
              if (i + 1 < line.length && line[i + 1] === '"') {
                cur += '"'; i++;
              } else {
                inQ = false;
              }
            } else {
              cur += ch;
            }
          } else {
            if (ch === ';') {
              out.push(cur); cur = '';
            } else if (ch === '"') {
              inQ = true;
            } else {
              cur += ch;
            }
          }
        }
        out.push(cur);
        return out.map(s => s.trim());
      }

      function pickRandomIndex(len) {
        return len > 0 ? Math.floor(Math.random() * len) : -1;
      }

      function applyShowVisibility() {
        // Show/hide by slot (1/2)
        for (const pos of [1, 2]) {
          const show = !!els.show[pos].checked;
          const el = document.querySelector(`.phrase-line[data-pos="${pos}"]`);
          if (el) el.style.display = show ? 'grid' : 'none';
        }
      }

      function setPhraseTexts(row) {
        const [l1, l2] = getSelectedLangCodes();
        renderPhraseText(1, row?.[l1] || '');
        renderPhraseText(2, row?.[l2] || '');
      }

      function renderPhraseText(slot, text) {
        const el = els.text[slot];
        if (!el) return;
        el.textContent = '';

        const tokens = String(text || '').match(/\S+|\s+|[.,!?;:]/g) || [];
        if (!tokens.length) return;

        tokens.forEach((token) => {
          if (/^\s+$/.test(token)) {
            el.appendChild(document.createTextNode(token));
            return;
          }

          const cleanWord = token.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '');
          if (!cleanWord) {
            el.appendChild(document.createTextNode(token));
            return;
          }

          const wordEl = document.createElement('span');
          wordEl.className = 'phrase-word';
          wordEl.textContent = token;
          wordEl.tabIndex = 0;
          wordEl.setAttribute('role', 'button');
          wordEl.setAttribute('aria-label', `Read aloud ${cleanWord}`);
          wordEl.dataset.word = cleanWord;
          wordEl.dataset.lang = getSelectedLangCodes()[slot];
          wordEl.addEventListener('click', handlePhraseWordClick);
          wordEl.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              handlePhraseWordClick(event);
            }
          });
          el.appendChild(wordEl);
        });
      }

      function handlePhraseWordClick(event) {
        const target = event.currentTarget || event.target;
        const word = target?.dataset?.word || (target && target.textContent ? target.textContent.trim() : '');
        const langCode = target?.dataset?.lang || getSelectedLangCodes()[1];
        const spokenText = String(word || '').replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '');

        if (!spokenText) return;

        try {
          const voices = speechSynthesis.getVoices();
          const vmap = getVoicesMap();
          const v = findVoiceForLang(voices, vmap[langCode], langCode);
          const u = new SpeechSynthesisUtterance(spokenText);
          if (v) u.voice = v;
          u.lang = (v && v.lang) ? v.lang : (langMeta[langCode]?.localeGuess?.[0] || 'en-US');
          const { rate, pitch } = getRatePitch();
          u.rate = rate;
          u.pitch = pitch;
          speechSynthesis.speak(u);
        } catch (e) {
          // ignore runtime errors from speech API
        }
      }

      // Toggle CSV textarea wrapping
      function applyCsvWrap() {
        const ta = els.csvBox;
        if (!ta) return;
        const wrap = !!(els.wrapCsv && els.wrapCsv.checked);
        try { ta.wrap = wrap ? 'soft' : 'off'; } catch (e) { /* ignore if unsupported */ }
        ta.style.whiteSpace = wrap ? 'pre-wrap' : 'pre';
        ta.style.overflowWrap = wrap ? 'break-word' : 'normal';
        // mirror wrap into viewer display
        if (els.csvBoxViewerDisplay) {
          els.csvBoxViewerDisplay.style.whiteSpace = wrap ? 'pre-wrap' : 'pre';
        }
      }

      function getReadOrder() {
        return [1, 2]; // read slot order
      }

      function getVoicesMap() {
        const map = {};
        const [l1, l2] = getSelectedLangCodes();
        map[l1] = (els.voices[1].options[els.voices[1].selectedIndex]?.value) || els.voices[1].value || '';
        map[l2] = (els.voices[2].options[els.voices[2].selectedIndex]?.value) || els.voices[2].value || '';
        return map;
      }

      // Find a matching SpeechSynthesisVoice given a desired selection (name) or language
      function findVoiceForLang(voices, desiredName, k) {
        if (desiredName) {
          // Exact name match
          let v = voices.find(vv => vv.name === desiredName || vv.voiceURI === desiredName);
          if (v) return v;
          // Case-insensitive contains match
          v = voices.find(vv => (vv.name || '').toLowerCase().includes(desiredName.toLowerCase()));
          if (v) return v;
        }
        // Fallback: prefer voices whose lang matches our guesses
        const guessList = langMeta[k]?.localeGuess || [k];
        let v = voices.find(vv => vv.lang && guessList.some(gl => vv.lang.startsWith(gl)));
        if (v) return v;
        // Last resort: match by language prefix (es, en, it, pt)
        v = voices.find(vv => vv.lang && vv.lang.startsWith(k));
        return v || null;
      }

      function getRatePitch() {
        return {
          rate: Math.max(0.5, Math.min(2, parseFloat(els.rate.value || '1') || 1)),
          pitch: Math.max(0, Math.min(2, parseFloat(els.pitch.value || '1') || 1)),
        };
      }

      // --- CSV viewer rendering ---
      function renderCsvViewer() {
        const disp = els.csvBoxViewerDisplay;
        const ta = els.csvBox;
        if (!disp || !ta) return;
        const colorA = (els.color1 && els.color1.value) || '#4da3ff';
        const colorB = (els.color2 && els.color2.value) || '#3ccf7a';
        const lines = (ta.value || '').split(/\r?\n/);
        const pad = String(lines.length).length;

        // Build HTML lines with a right-side line number element
        const html = lines.map((ln, idx) => {
          // preserve exact spacing and separators
          if (!ln) return `<div class="viewer-line"><span class="line-content"></span><span class="ln">${idx+1}</span></div>`;
          const m = ln.match(/^([^;]*)(;)([\s\S]*)$/);
          let contentHtml = '';
          if (m) {
            const left = m[1] || '';
            const sep = m[2] || '';
            const right = m[3] || '';
            const leftHtml = left ? `<span class="ph1" style="color:${colorA}">${escapeHtml(left)}</span>` : '';
            const rightHtml = right ? `<span class="ph2" style="color:${colorB}">${escapeHtml(right)}</span>` : '';
            contentHtml = `${leftHtml}${escapeHtml(sep)}${rightHtml}`;
          } else {
            contentHtml = escapeHtml(ln);
          }
          return `<div class="viewer-line"><span class="line-content">${contentHtml}</span><span class="ln">${idx+1}</span></div>`;
        }).join('');

        disp.innerHTML = html;

        // Reserve right padding in the textarea so numbers don't overlap user text (store original once)
        try {
          const cs = window.getComputedStyle(ta);
          if (!ta.dataset._origPaddingRight) ta.dataset._origPaddingRight = cs.paddingRight || '0px';
          // measure width of the widest line-number (monospace digits)
          const measure = document.createElement('span');
          measure.style.position = 'absolute';
          measure.style.visibility = 'hidden';
          measure.style.whiteSpace = 'nowrap';
          measure.style.font = cs.font;
          measure.textContent = '9'.repeat(Math.max(1, pad));
          document.body.appendChild(measure);
          const lnPx = measure.offsetWidth + 12; // extra spacing
          document.body.removeChild(measure);
          const base = parseFloat(ta.dataset._origPaddingRight) || 0;
          ta.style.paddingRight = (base + lnPx) + 'px';
        } catch (e) { /* ignore measurement errors */ }

        // ensure viewer styles match the csv textarea (fixed relationship)
        syncViewerStyles();
      }

      function escapeHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

      // Keep the viewer styles matched to the actual styles used by the csv textarea
      function syncViewerStyles() {
        try {
          if (!els.csvBox) return;
          const cs = window.getComputedStyle(els.csvBox);
          if (!cs) return;
          const props = {
            fontSize: cs.fontSize,
            fontFamily: cs.fontFamily,
            fontWeight: cs.fontWeight,
            lineHeight: cs.lineHeight,
            paddingTop: cs.paddingTop,
            paddingRight: cs.paddingRight,
            paddingBottom: cs.paddingBottom,
            paddingLeft: cs.paddingLeft,
            whiteSpace: cs.whiteSpace,
            backgroundColor: cs.backgroundColor,
            letterSpacing: cs.letterSpacing,
            boxSizing: cs.boxSizing,
            width: cs.width,
            height: cs.height,
            overflow: cs.overflow,
          };
          if (els.csvBoxViewerDisplay) {
            Object.assign(els.csvBoxViewerDisplay.style, {
              fontSize: props.fontSize,
              fontFamily: props.fontFamily,
              fontWeight: props.fontWeight,
              lineHeight: props.lineHeight,
              paddingTop: props.paddingTop,
              paddingRight: props.paddingRight,
              paddingBottom: props.paddingBottom,
              paddingLeft: props.paddingLeft,
              whiteSpace: props.whiteSpace,
              background: 'transparent',
              letterSpacing: props.letterSpacing,
            });
          }
        } catch (e) { /* ignore */ }
      }


      // --- Local Storage: save / load UI configuration ---
      const STORAGE_KEY = 'lang_trainer_config_v1';

      function loadConfig() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const cfg = JSON.parse(raw);
          savedConfig = cfg; // keep for populateVoices which runs later
          // restore selected languages first
          if (cfg.lang1) els.lang1Select.value = cfg.lang1;
          if (cfg.lang2) els.lang2Select.value = cfg.lang2;
          updateLangLabels();
          if (cfg.show) {
            const l1 = cfg.lang1 || els.lang1Select.value; const l2 = cfg.lang2 || els.lang2Select.value;
            els.show[1].checked = !!cfg.show[l1]; els.show[2].checked = !!cfg.show[l2];
          }
          if (cfg.read) {
            const l1 = cfg.lang1 || els.lang1Select.value; const l2 = cfg.lang2 || els.lang2Select.value;
            els.read[1].checked = !!cfg.read[l1]; els.read[2].checked = !!cfg.read[l2];
          }
          if (cfg.rate) els.rate.value = cfg.rate;
          if (cfg.pitch) els.pitch.value = cfg.pitch;
          if (cfg.speakingMin != null && els.speakingMin) {
            els.speakingMin.value = Math.max(50, Math.min(100, parseInt(cfg.speakingMin, 10) || 90));
            speakingPractice.min = parseInt(els.speakingMin.value, 10);
          }
          if (cfg.speakingWait != null && els.speakingWait) {
            els.speakingWait.value = Math.max(1, Math.floor(Number(cfg.speakingWait) || 3));
          }
          if (cfg.speakingAfterMin != null && els.speakingAfterMin) {
            els.speakingAfterMin.value = Math.max(0, Math.floor(Number(cfg.speakingAfterMin) || 0));
          }
          if (cfg.font) { els.fontRange.value = cfg.font; document.documentElement.style.setProperty('--phrase-font', cfg.font + 'px'); els.fontValue.textContent = cfg.font + ' px'; }
          if (typeof cfg.themeDark !== 'undefined') { els.themeToggle.checked = !!cfg.themeDark; document.body.classList.toggle('theme-light', !els.themeToggle.checked); document.body.classList.toggle('theme-dark', els.themeToggle.checked); }
          if (cfg.mode) els.modeSelect.value = cfg.mode;
          if (cfg.aiLevel) els.aiLevel.value = cfg.aiLevel;
          if (cfg.aiTopic) els.aiTopic.value = cfg.aiTopic;

            syncRandomToggleVisualState();

          }
          if (cfg.csv) { els.csvBox.value = cfg.csv; ensureParsed(); }
          if (typeof cfg.wrapCsv !== 'undefined') { try { els.wrapCsv.checked = !!cfg.wrapCsv; } catch (e) { } applyCsvWrap(); }
          if (cfg.color1) { try { if (els.color1) els.color1.value = cfg.color1; } catch (e) {} }
          if (cfg.color2) { try { if (els.color2) els.color2.value = cfg.color2; } catch (e) {} }
          if (cfg.practiceLang) {
            const [l1, l2] = getSelectedLangCodes();
            const allowed = [l1, l2];
            const nextLang = allowed.includes(cfg.practiceLang) ? cfg.practiceLang : allowed[0];
            syncPracticeLanguageSelection(nextLang);
          }
        } catch (e) { console.warn('loadConfig failed', e); }
      }

      // wire up wrapCsv change to apply immediately and persist
      try {
        if (els.wrapCsv) {
          els.wrapCsv.addEventListener('change', () => { applyCsvWrap(); renderCsvViewer(); saveConfig(); });
        }
      } catch (e) { /* ignore wiring errors */ }

      // Keep overlay size matched to textarea when user resizes the textarea
      try {
        if (window.ResizeObserver && els.csvBox && els.csvBoxViewerDisplay) {
          const ro = new ResizeObserver(() => {
            try {
              const ta = els.csvBox;
              const disp = els.csvBoxViewerDisplay;
              disp.style.width = ta.offsetWidth + 'px';
              disp.style.height = ta.offsetHeight + 'px';
              // keep scroll positions matched
              disp.scrollTop = ta.scrollTop;
              disp.scrollLeft = ta.scrollLeft;
              syncViewerStyles();
            } catch (e) { /* ignore */ }
          });
          ro.observe(els.csvBox);
        }
      } catch (e) { /* ignore */ }

      // --- Speech Synthesis: robust sequence with session token and timeouts ---
      async function speakCurrentRowSequence(sessionToken, row) {
        // Gather settings per slot
        const readSlots = { 1: !!els.read[1].checked, 2: !!els.read[2].checked };
        const any = readSlots[1] || readSlots[2];
        if (!any) return; // resolve immediately

        // Wait for voices to be ready (up to 1000ms).
        // Fast path: if voices are already loaded (the common case after the
        // first phrase), resolve immediately. Only wait when the list is empty,
        // because onvoiceschanged fires only once, when the list first loads.
        await new Promise(res => {
          if (speechSynthesis.getVoices().length > 0) { res(); return; }
          const start = performance.now();
          let done = false;
          const finish = () => {
            if (done) return;
            done = true;
            speechSynthesis.onvoiceschanged = null;
            res();
          };
          const tryNow = () => {
            if (done) return;
            if (speechSynthesis.getVoices().length > 0 || performance.now() - start > 1000) {
              finish();
            } else {
              setTimeout(tryNow, 100);
            }
          };
          if ('onvoiceschanged' in speechSynthesis) {
            speechSynthesis.onvoiceschanged = finish;
          }
          // Poll as well so we resolve as soon as voices appear, and cap at 1000ms.
          tryNow();
        });

        // Cancel anything pending, then enqueue sequence
        try { speechSynthesis.cancel(); } catch { }

        const voices = speechSynthesis.getVoices();
        const voiceIds = getVoicesMap();
        const { rate, pitch } = getRatePitch();
        const order = getReadOrder().filter(pos => readSlots[pos]);

        let totalChars = 0;
        const utters = [];
        const [l1, l2] = getSelectedLangCodes();
        const slotToLang = { 1: l1, 2: l2 };
        for (const pos of order) {
          const k = slotToLang[pos];
          const text = (row && row[k]) ? String(row[k]) : '';
          totalChars += text.length;
          const u = new SpeechSynthesisUtterance(text);
          const v = findVoiceForLang(voices, voiceIds[k], k);
          if (v) u.voice = v;
          u.lang = (v && v.lang) ? v.lang : (langMeta[k]?.localeGuess?.[0] || 'en-US');
          u.rate = rate;
          u.pitch = pitch;
          utters.push({ pos, k, u });
        }

        let endedCount = 0;
        let resolved = false;
        let resolveOuter = null;

        const finishResolve = () => {
          if (resolved) return;
          resolved = true;
          if (typeof resolveOuter === 'function') resolveOuter();
        };

        const hardTimeoutMs = Math.max(12000, 12000 + Math.ceil(totalChars / 100) * 2000);
        const hardTimer = setTimeout(() => {
          if (document.hidden) {
            try { speechSynthesis.cancel(); } catch { }
            finishResolve();
          } else {
            try { speechSynthesis.cancel(); } catch { }
            finishResolve();
          }
        }, hardTimeoutMs);

        // Fallback poll: only used if onend/onerror never fire. It waits for
        // speech to actually start, then for silence, so it can't resolve early.
        // The normal path resolves immediately via onend (see below).
        let startedSpeaking = false;
        let lastSpeakingFalse = null;
        const poll = setInterval(() => {
          if (resolved) { clearInterval(poll); return; }
          if (speechSynthesis.speaking) {
            startedSpeaking = true;
            lastSpeakingFalse = null;
          } else if (startedSpeaking) {
            if (lastSpeakingFalse == null) lastSpeakingFalse = performance.now();
            if (performance.now() - lastSpeakingFalse >= 300) {
              clearInterval(poll);
              clearTimeout(hardTimer);
              finishResolve();
            }
          }
        }, 100);

        await new Promise(resolve => {
          // Let finishResolve() end this promise directly (no polling latency).
          resolveOuter = () => {
            clearInterval(poll);
            clearTimeout(hardTimer);
            resolve();
          };
          const maybeFinish = () => {
            if (resolved) return;
            if (endedCount >= utters.length) {
              clearInterval(poll);
              clearTimeout(hardTimer);
              finishResolve();
            }
          };
          // Attach handlers and speak sequentially (enqueue lets them play in order)
          for (const { u } of utters) {
            u.onend = () => {
              if (resolved) return;
              if (sessionToken !== phraseSessionId) return;
              endedCount++;
              maybeFinish();
            };
            u.onerror = () => {
              if (resolved) return;
              if (sessionToken !== phraseSessionId) return;
              endedCount++;
              maybeFinish();
            };
            speechSynthesis.speak(u);
          }
          // Resolution is driven by onend/onerror (maybeFinish), the fallback
          // poll, or the hard timeout — each routes through finishResolve ->
          // resolveOuter, which resolves this promise.
        });
      }

      // Single-language replay (row scope only)
      // NOTE: Do not cancel or change the global `phraseSessionId` here.
      // Replaying must not interrupt or stop active modes (Auto/Speaking/Writing).
      function replaySlot(pos) {
        if (currentIndex < 0 || !parsedRows[currentIndex]) return;
        const row = parsedRows[currentIndex];
        const [l1, l2] = getSelectedLangCodes();
        const slotToLang = { 1: l1, 2: l2 };
        const k = slotToLang[pos];
        const text = row[k] || '';
        // Create a standalone utterance for replay only. Do not cancel existing speech
        // and do not modify `phraseSessionId` so modes continue uninterrupted.
        try {
          const vmap = getVoicesMap();
          const voices = speechSynthesis.getVoices();
          const v = findVoiceForLang(voices, vmap[k], k);
          const u = new SpeechSynthesisUtterance(text);
          if (v) u.voice = v;
          u.lang = (v && v.lang) ? v.lang : (langMeta[k]?.localeGuess?.[0] || 'en-US');
          const { rate, pitch } = getRatePitch();
          u.rate = rate; u.pitch = pitch;
          // Make this utterance fire but do not attach global session handlers.
          speechSynthesis.speak(u);
        } catch (e) {
          // ignore runtime errors from speech API
        }
      }

      // --- Selection & Display ---
      function ensureParsed() {
        parsedRows = parseCSV(els.csvBox.value);
      }

      function syncRandomToggleVisualState() {
        const toggle = els.randomToggle;
        const pill = toggle && toggle.closest('.toggle-pill');
        if (!toggle || !pill) return;
        const isOn = !!toggle.checked;
        pill.classList.toggle('is-on', isOn);
        pill.classList.toggle('is-off', !isOn);
        const icon = pill.querySelector('.toggle-icon');
        if (icon) icon.textContent = '🔀';
        pill.setAttribute('title', isOn ? 'Random mode active: random phrase selection' : 'Sequential mode active: next phrase in CSV order');
        pill.setAttribute('aria-label', isOn ? 'Random phrase order enabled' : 'Sequential phrase order enabled');
      }

      function syncRandomModeCheckboxes() {
        const enabled = !!(els.randomToggle && els.randomToggle.checked);
        const selectors = ['#auto-random', '#sp-random', '#wr-random'];
        selectors.forEach((selector) => {
          const input = els.modeContent?.querySelector(selector);
          if (input) input.checked = enabled;
        });
      }

      function bindRandomModeCheckboxes() {
        const selectors = ['#auto-random', '#sp-random', '#wr-random'];
        selectors.forEach((selector) => {
          const input = els.modeContent?.querySelector(selector);
          if (!input) return;
          input.onchange = () => {
            if (els.randomToggle) els.randomToggle.checked = !!input.checked;
            syncRandomToggleVisualState();
            saveConfig();
          };
        });
      }

      function getRandomSelectionEnabled() {
        if (els.randomToggle) return !!els.randomToggle.checked;
        const mode = els.modeSelect?.value;
        if (mode === 'Auto Mode') return !!(els.modeContent?.querySelector('#auto-random')?.checked);
        if (mode === 'Speaking Practice Mode') return !!(els.modeContent?.querySelector('#sp-random')?.checked);
        if (mode === 'Writing Practice Mode') return !!(els.modeContent?.querySelector('#wr-random')?.checked);
        return true;
      }

      function showCurrentDisplayedRow({ speak = true } = {}) {
        ensureParsed();
        if (!parsedRows.length) return Promise.resolve();
        if (currentIndex < 0) currentIndex = 0;

        const row = parsedRows[currentIndex];
        if (!row) return Promise.resolve();
        setPhraseTexts(row);
        applyShowVisibility();
        const sessionToken = ++phraseSessionId;
        if (speak) {
          return speakCurrentRowSequence(sessionToken, row);
        }
        return Promise.resolve();
      }

      function selectAndShowNextRow({ speak = true, random = null } = {}) {
        ensureParsed();
        if (!parsedRows.length) return Promise.resolve();
        // Decide random/sequential if not explicitly provided; global toggle is the shared source of truth.
        if (random === null) {
          random = getRandomSelectionEnabled();
        }

        if (random) {
          currentIndex = pickRandomIndex(parsedRows.length);
        } else {
          if (currentIndex < 0) currentIndex = 0;
          else currentIndex = (currentIndex + 1) % parsedRows.length;
        }

        const row = parsedRows[currentIndex];
        setPhraseTexts(row);
        applyShowVisibility();
        const sessionToken = ++phraseSessionId;
        if (speak) {
          return speakCurrentRowSequence(sessionToken, row);
        }
        return Promise.resolve();
      }

      function stopManualPlaybackLoop() {
        manualPlaybackLoop.active = false;
      }

      async function startManualPlaybackLoop() {
        ensureParsed();
        if (!parsedRows.length) return;
        if (manualPlaybackLoop.active) return;
        manualPlaybackLoop.active = true;

        while (manualPlaybackLoop.active) {
          if (currentIndex < 0) currentIndex = 0;
          let row = parsedRows[currentIndex];
          if (!row) {
            currentIndex = 0;
            row = parsedRows[currentIndex];
          }
          if (!row) break;

          setPhraseTexts(row);
          applyShowVisibility();
          await speakCurrentRowSequence(++phraseSessionId, row);
          if (!manualPlaybackLoop.active) break;

          if (getRandomSelectionEnabled()) {
            currentIndex = pickRandomIndex(parsedRows.length);
          } else {
            currentIndex = (currentIndex + 1) % parsedRows.length;
          }
        }

        manualPlaybackLoop.active = false;
      }

      // Jump to the first phrase and display/speak it in the existing visualizers.
      function goToFirstRow({ speak = true } = {}) {
        ensureParsed();
        if (!parsedRows.length) return Promise.resolve();
        currentIndex = 0;
        const row = parsedRows[currentIndex];
        setPhraseTexts(row);
        applyShowVisibility();
        const sessionToken = ++phraseSessionId;
        if (speak) {
          return speakCurrentRowSequence(sessionToken, row);
        }
        return Promise.resolve();
      }

        const mode = els.modeSelect?.value;
        if (!els.brand) return;
        if (mode === 'Speaking Practice Mode') {
          els.brand.textContent = 'Speaking Practice';

          els.brand.textContent = 'Writing Practice';
        } else {
          els.brand.textContent = 'Language Practice';

      // --- Modes UI ---
      function togglePanel(panel) {
        if (!panel) return;
        const header = panel.querySelector('.panel-title');
        const content = panel.querySelector('.panel-content');
        const isCollapsed = panel.classList.toggle('collapsed');
        if (header) header.setAttribute('aria-expanded', String(!isCollapsed));
        if (content) {
          content.style.display = isCollapsed ? 'none' : 'block';
        }
      }

      function initCollapsiblePanels() {
        document.querySelectorAll('.sheet .panel').forEach((panel) => {
          const header = panel.querySelector('.panel-title');
          if (!header || header.dataset.collapsibleBound === 'true') return;

          header.dataset.collapsibleBound = 'true';
          header.setAttribute('type', 'button');
          header.setAttribute('role', 'button');
          header.setAttribute('tabindex', '0');
          header.classList.add('accordion-trigger');

          if (!panel.querySelector('.panel-content')) {
            const contentNodes = Array.from(panel.childNodes).filter((node) => node !== header && !(node.nodeType === Node.TEXT_NODE && !node.textContent.trim()));
            if (contentNodes.length) {
              const content = document.createElement('div');
              content.className = 'panel-content';
              contentNodes.forEach((node) => content.appendChild(node));
              panel.appendChild(content);
            }
          }

          const content = panel.querySelector('.panel-content');
          const isInitiallyCollapsed = panel.classList.contains('collapsed');
          header.setAttribute('aria-expanded', String(!isInitiallyCollapsed));
          if (content) {
            content.style.display = isInitiallyCollapsed ? 'none' : 'block';
          }

          const chevron = header.querySelector('.panel-chevron');
          if (!chevron) {
            const icon = document.createElement('span');
            icon.className = 'panel-chevron';
            icon.setAttribute('aria-hidden', 'true');
            icon.textContent = '▾';
            header.appendChild(icon);
          }

          panel.classList.add('is-collapsible');

          const onToggle = (event) => {
            event.preventDefault();
            event.stopPropagation();
            togglePanel(panel);
          };

          header.removeEventListener('click', onToggle);
          header.addEventListener('click', onToggle);
          header.removeEventListener('pointerdown', onToggle);
          header.addEventListener('pointerdown', (event) => {
            event.stopPropagation();
          });
          header.removeEventListener('keydown', onToggle);
          header.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              event.stopPropagation();
              onToggle(event);
            }
          });
        });
      }

              opt.textContent = (langMeta[c] && langMeta[c].label) ? langMeta[c].label : c.toUpperCase();

            if ([...wrLangEl.options].some(o => o.value === selectedPracticeLang)) {

            } else if (savedConfig && savedConfig.writingLang && [...wrLangEl.options].some(o => o.value === savedConfig.writingLang)) {
              wrLangEl.value = savedConfig.writingLang; writingPractice.lang = savedConfig.writingLang;

      // --- Speaking Practice Flow ---
      function getSpeechSilenceWaitSeconds() {
        const waitEl = els.speakingWait || (els.modeContent && els.modeContent.querySelector ? els.modeContent.querySelector('#sp-wait') : null);
        return waitEl ? Math.max(1, Math.floor(Number(waitEl.value) || 3)) : 3;
      }

      function getSpeakingAfterMinSeconds() {
        const waitEl = els.speakingAfterMin || (els.modeContent && els.modeContent.querySelector ? els.modeContent.querySelector('#sp-after-min') : null);
        return waitEl ? Math.max(0, Math.floor(Number(waitEl.value) || 0)) : 0;
      }

      function updateSpeakingMinFromInput(inputEl, commit = false) {
        const value = Number(inputEl.value);
        if (!Number.isFinite(value) || inputEl.value === '') return;
        if (!commit && (value < 50 || value > 100)) return;
        speakingPractice.min = Math.max(50, Math.min(100, Math.trunc(value)));
        inputEl.value = speakingPractice.min;
        if (inputEl !== els.speakingMin && els.speakingMin) els.speakingMin.value = speakingPractice.min;
        const modeMin = els.modeContent && els.modeContent.querySelector('#sp-min');
        if (modeMin && modeMin !== inputEl) modeMin.value = speakingPractice.min;
        saveConfig();
      }

      function scheduleSpeakingAdvance(rec, token) {
        if (speakingPractice.advanceTimer || !speakingPractice.active) return;
        const waitSec = getSpeakingAfterMinSeconds();
        const deadline = Date.now() + waitSec * 1000;
        const updateStatus = () => {
          if (speakingPractice.statusEl) {
            const remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
            speakingPractice.statusEl.textContent = `Minimum reached. Advancing in ${remaining}s...`;
          }
        };
        updateStatus();
        speakingPractice.advanceInterval = setInterval(updateStatus, 200);
        speakingPractice.advanceTimer = setTimeout(() => {
          speakingPractice.advanceTimer = null;
          if (speakingPractice.advanceInterval) {
            clearInterval(speakingPractice.advanceInterval);
            speakingPractice.advanceInterval = null;
          }
          if (speakingPractice.active && speakingPractice.rec === rec && token === phraseSessionId) {
            safeAdvanceSpeakingPractice(token);

      function createRecognition(lang) {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) return null;
        const rec = new SR();
        const mobileSpeech = isMobileSpeechBrowser();
        rec.lang = pickRecLang(lang);
        rec.continuous = true;
        // Use interim results (matches index.html behavior which works on phones)
        rec.interimResults = true;
        rec.maxAlternatives = 1;
        // Per-recognition silence timer state
        rec._silenceTimer = null;
        rec._silenceInterval = null;
        rec._startTimer = null;
        rec._hasSpoken = false;
        rec._accTranscript = '';
        rec._accCaptured = false;
        rec._lastSpeechTs = 0;
        rec._lastInterim = '';
        rec._finalByIndex = Object.create(null);
        rec._resultBaseIndex = 0;
        rec._lastResultsLength = 0;
        rec._suppressRestart = false;
        return rec;
      }

      function pickRecLang(k) {

        return langMeta[k].localeGuess[0] || 'en-US';

            else interim += (res[0] && res[0].transcript) || '';
          }
          const liveRaw = (finalText || interim || '').trim();
          let liveForCompare = liveRaw;
          try {
            if (rec && rec._accTranscript) {
              const nextClean = removeTokenOverlap(rec._accTranscript, liveRaw);
              liveForCompare = (rec._accTranscript + (nextClean ? (' ' + nextClean) : '')).trim();
            }
          } catch (e) { /* ignore */ }

          if (finalText || interim) {

          const matched = (pct >= speakingPractice.min && finalText);

          if (finalText) {
            try {
              const ft = finalText.trim();
              if (ft) {
                if (!rec._accTranscript) rec._accTranscript = ft;
                else {
                  const nextClean = removeTokenOverlap(rec._accTranscript, ft);
                  if (nextClean) rec._accTranscript = (rec._accTranscript + ' ' + nextClean).trim();

        rec.onerror = (ev) => {

      function scheduleSilenceReset(rec) {
        try {
          if (!rec) return;
          if (!speakingPractice.active || speakingPractice.rec !== rec || !rec._hasSpoken) {
            setSilenceCounterText('');
            return;
          }

          const waitSec = getSpeechSilenceWaitSeconds();
          if (rec._silenceTimer) clearTimeout(rec._silenceTimer);
          if (rec._silenceInterval) clearInterval(rec._silenceInterval);

          rec._lastSpeechTs = Date.now();
          rec._silenceDeadline = rec._lastSpeechTs + waitSec * 1000;

          setSilenceCounterText(waitSec + 's');

          rec._silenceInterval = setInterval(() => {
            try {
              const ms = rec._silenceDeadline - Date.now();
              if (ms <= 0) {
                setSilenceCounterText('0s');
                clearInterval(rec._silenceInterval); rec._silenceInterval = null;
                return;
              }
              setSilenceCounterText(Math.ceil(ms / 1000) + 's');
            } catch (e) {}
          }, 200);

          rec._silenceTimer = setTimeout(() => {
            try {
              if (!speakingPractice.active || speakingPractice.rec !== rec) return;
              if (Date.now() - rec._lastSpeechTs < waitSec * 1000) {
                scheduleSilenceReset(rec);
                return;
              }
              resetSpeechUiAfterSilence();
            } catch (e) {}

            rec._hasSpoken = false;
            rec._lastSpeechTs = 0;
            rec._accTranscript = '';
            rec._accCaptured = false;
            rec._lastInterim = '';
            rec._finalByIndex = Object.create(null);
            rec._resultBaseIndex = rec._lastResultsLength || 0;
            if (rec._silenceTimer) { clearTimeout(rec._silenceTimer); rec._silenceTimer = null; }
            if (rec._silenceInterval) { clearInterval(rec._silenceInterval); rec._silenceInterval = null; }
            setSilenceCounterText('');
          }, waitSec * 1000);
        } catch (e) { /* ignore */ }

      // --- Writing Practice Flow ---
      async function startWritingPractice() {
        if (writingPractice.active) return;
        writingPractice.active = true;
        if (writingPractice.statusEl) writingPractice.statusEl.textContent = 'Starting…';
        writingPractice.lang = (els.modeContent.querySelector('#wr-lang')?.value) || writingPractice.lang || 'es';
        // persist chosen writing language

        updateCurrentWriteTarget();
        if (writingPractice.statusEl) writingPractice.statusEl.textContent = 'Type what you hear…';
        if (writingPractice.remainingEl) {
          const remaining = writingPractice.currentWriteTarget ? Math.max(0, writingPractice.currentWriteTarget.trim().split(/\s+/).filter(Boolean).length) : 0;
          writingPractice.remainingEl.textContent = `${remaining} / ${remaining}`;
        }
        if (writingPractice.scoreEl) writingPractice.scoreEl.textContent = '0%';

        // Attach oninput handler referencing mutable target
        const input = writingPractice.inputEl;
        if (input) {
          input.value = '';
          input.disabled = false;
        }

        const onInput = async (e) => {
          if (!writingPractice.active || writingPractice.writingBusy) return;
          const user = normalizeForCompare(e.target.value);
          const target = normalizeForCompare(writingPractice.currentWriteTarget);
          const pct = target ? Math.round((user.length && target.indexOf(user) === 0 ? Math.min(user.length / target.length, 1) : 0) * 100) : 0;
          if (writingPractice.scoreEl) writingPractice.scoreEl.textContent = `${Math.max(0, Math.min(100, pct))}%`;
          if (user && user === target) {
            writingPractice.writingBusy = true;

            try { speechSynthesis.cancel(); } catch { }
            if (getRandomSelectionEnabled()) {
              currentIndex = pickRandomIndex(parsedRows.length);

              if (currentIndex < 0) currentIndex = 0;
              else currentIndex = (currentIndex + 1) % parsedRows.length;

            await showCurrentDisplayedRow({ speak: true });
            updateCurrentWriteTarget();
            e.target.value = '';
            writingPractice.writingBusy = false;
          }
        };

        if (input) input.oninput = onInput;
